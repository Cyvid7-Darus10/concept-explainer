// ---- map.js ----
// Chapter: architecture map. Layers are columns, nodes are pressable cards,
// edges are an SVG overlay redrawn whenever the layout changes.
function renderMap(data, mount) {
  const layers = list(data.layers);
  const nodes = list(data.nodes);
  const edges = list(data.edges);
  const nodeIndex = byId(nodes);
  const changedIds = new Set(list(data.changes).flatMap((change) => list(change.nodes)));

  const svg = s('svg', { class: 'map-edges', 'aria-hidden': 'true' });
  const grid = h('div', { class: 'map-grid', style: `--cols:${Math.max(layers.length, 1)}` },
    layers.map((layer) => mapColumn(layer, nodes, changedIds, (id) => select(id))));
  const canvas = h('div', { class: 'map-canvas', style: `--cols:${Math.max(layers.length, 1)}` }, svg, grid);
  const detail = h('aside', { class: 'map-detail panel', 'aria-live': 'polite' });
  let selectedId = null;

  function select(id) {
    setSelected(selectedId === id ? null : id);
    setDeepLink(selectedId ? `map/${linkPart(selectedId)}` : 'map');
  }

  function setSelected(id) {
    selectedId = id;
    if (id) delete canvas.dataset.changes;
    paintSelection();
    renderDetail();
  }

  function related(id) {
    return edges.filter((edge) => edge.from === id || edge.to === id);
  }

  function paintSelection() {
    canvas.classList.toggle('has-selection', Boolean(selectedId));
    canvas.classList.remove('is-changes');
    const neighbours = new Set(selectedId ? related(selectedId).flatMap((e) => [e.from, e.to]) : []);
    grid.querySelectorAll('.node').forEach((el) => {
      el.classList.toggle('is-selected', el.dataset.node === selectedId);
      el.classList.toggle('is-related', neighbours.has(el.dataset.node));
      el.setAttribute('aria-pressed', String(el.dataset.node === selectedId));
    });
    svg.querySelectorAll('[data-edge]').forEach((el) => {
      const [from, to] = el.dataset.edge.split('→');
      const active = from === selectedId || to === selectedId;
      el.querySelectorAll('path, text').forEach((part) => part.classList.toggle('is-active', active));
      el.querySelector('path').setAttribute('marker-end', active ? 'url(#map-arrow-active)' : 'url(#map-arrow)');
    });
  }

  function renderDetail() {
    fill(detail, ...(selectedId ? nodeDetail(nodeIndex.get(selectedId)) : emptyDetail()));
  }

  function emptyDetail() {
    return [h('div', { class: 'detail-main' },
      h('p', { class: 'eyebrow quiet' }, 'Tip'),
      h('h3', null, 'Pick any box above'),
      h('p', null, 'You will see what it does, which files hold it, and who it talks to. Pick it again to clear.'))];
  }

  function nodeDetail(node) {
    const layer = layers.find((l) => l.id === node.layer);
    const links = related(node.id);
    const flows = list(data.flows).filter((flow) => list(flow.steps).some((st) => st.from === node.id || st.to === node.id));
    return [h('div', { class: 'detail-main' },
      h('div', { class: 'step-top' }, h('span', { class: 'detail-icon' }, icon(node.kind)), tag(text(layer && layer.label, node.layer), 'tag-layer'), node.kind && tag(node.kind)),
      h('h3', null, softBreaks(node.label)),
      h('p', null, softBreaks(text(node.summary, 'No summary yet.'))),
      node.tech && h('p', { class: 'detail-tech' }, softBreaks(node.tech)),
      list(node.files).length > 0 && [h('div', { class: 'detail-label' }, 'Lives in'), h('div', { class: 'files' }, list(node.files).map(fileChip))]),
    h('div', { class: 'detail-side' },
      links.length > 0 && [h('div', { class: 'detail-label' }, 'Talks to'), h('ul', { class: 'rel' }, links.map((edge) => relationItem(edge, node.id)))],
      flows.length > 0 && [h('div', { class: 'detail-label' }, 'Shows up in'), h('ul', { class: 'rel' }, flows.map((flow) => h('li', null,
        h('a', { class: 'link', href: `#flows/${linkPart(flow.id)}` }, softBreaks(flow.title)))))]),
    ];
  }

  function relationItem(edge, selfId) {
    const otherId = edge.from === selfId ? edge.to : edge.from;
    const other = nodeIndex.get(otherId);
    const direction = edge.from === selfId ? '→' : '←';
    return h('li', null, h('span', { class: 'arrow-glyph' }, direction),
      h('button', { class: 'link', type: 'button', onclick: () => select(otherId) }, softBreaks(other ? other.label : otherId)),
      edge.label && tag(edge.label));
  }

  function drawEdges() {
    const box = canvas.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
    const defs = s('defs', null, arrowMarker('map-arrow', 'is-rest'), arrowMarker('map-arrow-active', 'is-active'));
    const paths = edges.map((edge) => edgeShape(edge, box)).filter(Boolean);
    fill(svg, defs, ...paths);
    paintSelection();
    if (canvas.dataset.changes === 'on') showChanges();
  }

  function edgeShape(edge, box) {
    const fromEl = grid.querySelector(`[data-node="${CSS.escape(edge.from)}"]`);
    const toEl = grid.querySelector(`[data-node="${CSS.escape(edge.to)}"]`);
    if (!fromEl || !toEl) return null;
    const a = relativeRect(fromEl, box);
    const b = relativeRect(toEl, box);
    const d = connectorPath(a, b);
    const key = `${edge.from}→${edge.to}`;
    const mid = { x: (a.cx + b.cx) / 2, y: (a.cy + b.cy) / 2 };
    // No label when the boxes almost touch: it would sit on top of them.
    const gap = Math.max(b.left - a.right, a.left - b.right, b.top - a.bottom, a.top - b.bottom);
    return s('g', { 'data-edge': key },
      s('path', { class: `edge${edge.kind === 'async' ? ' is-async' : ''}`, d, 'marker-end': 'url(#map-arrow)' }),
      edge.label && gap > 36 && s('text', { class: 'edge-label', x: mid.x, y: mid.y - 6, 'text-anchor': 'middle' }, truncate(edge.label, 28)));
  }

  function showChanges() {
    canvas.classList.remove('has-selection');
    canvas.classList.add('is-changes');
    grid.querySelectorAll('.node').forEach((el) => el.classList.toggle('is-changed', changedIds.has(el.dataset.node)));
  }

  on('highlight-changes', ({ enabled }) => {
    selectedId = null;
    renderDetail();
    if (enabled) canvas.dataset.changes = 'on'; else delete canvas.dataset.changes;
    if (enabled) showChanges(); else paintSelection();
  });

  renderDetail();
  mount.append(
    h('div', { class: 'map-shell' }, h('div', { class: 'panel map-panel' }, h('div', { class: 'map-scroll' }, canvas)), detail),
    h('div', { class: 'map-legend' },
      h('span', null, h('i'), 'Calls / reads'),
      h('span', null, h('i', { class: 'dash' }), 'Async / events'),
      changedIds.size > 0 && h('span', null, h('span', { class: 'tag tag-new' }, 'New'), 'Changed recently')),
  );
  // As many layer columns as fit at MAP_MIN_COL each; the rest wrap onto
  // the next row, so the map never scrolls sideways.
  const fitColumns = () => {
    const width = canvas.parentElement ? canvas.parentElement.clientWidth : 0;
    const fit = Math.max(1, Math.min(layers.length, Math.floor((width + MAP_GAP) / (MAP_MIN_COL + MAP_GAP))));
    if (canvas.style.getPropertyValue('--fit-cols') !== String(fit)) canvas.style.setProperty('--fit-cols', String(fit));
  };
  const redraw = () => window.requestAnimationFrame(() => { fitColumns(); drawEdges(); });
  new ResizeObserver(redraw).observe(canvas.parentElement || canvas);
  if (document.fonts) document.fonts.ready.then(redraw);
  return {
    open([id] = []) {
      if (id === undefined) return null;
      setSelected(nodeIndex.has(id) ? id : null);
      return null;
    },
  };
}

const MAP_MIN_COL = 150;
const MAP_GAP = 40;

function mapColumn(layer, nodes, changedIds, onSelect) {
  const layerNodes = nodes.filter((node) => node.layer === layer.id);
  return h('div', { class: 'map-col', style: layerStyle(layer.color) },
    h('div', { class: 'map-col-head' }, truncatable(h('span', { class: 'map-col-name' }, softBreaks(layer.label)), layer.label)),
    layerNodes.map((node) => h('button', {
      class: 'node', type: 'button', 'data-node': node.id, 'aria-pressed': 'false', onclick: () => onSelect(node.id),
    },
    changedIds.has(node.id) && h('span', { class: 'node-badge tag tag-new' }, 'New'),
    h('span', { class: 'node-icon' }, icon(node.kind)),
    h('span', { class: 'node-text' }, h('span', { class: 'node-label' }, softBreaks(node.label)), node.tech && truncatable(h('span', { class: 'node-tech' }, softBreaks(node.tech)), node.tech)))));
}

function relativeRect(el, box) {
  const r = el.getBoundingClientRect();
  const left = r.left - box.left;
  const top = r.top - box.top;
  return { left, top, right: left + r.width, bottom: top + r.height, cx: left + r.width / 2, cy: top + r.height / 2 };
}

// Route across the wider gap between the two boxes, so a line never runs
// along a box edge when boxes sit diagonally close.
function connectorPath(a, b) {
  const gapX = Math.max(b.left - a.right, a.left - b.right);
  const gapY = Math.max(b.top - a.bottom, a.top - b.bottom);
  const horizontal = gapX >= gapY;
  if (horizontal) {
    const forward = b.cx > a.cx;
    const x1 = forward ? a.right : a.left;
    const x2 = forward ? b.left - 4 : b.right + 4;
    const bend = (x2 - x1) / 2;
    return `M${x1},${a.cy} C${x1 + bend},${a.cy} ${x2 - bend},${b.cy} ${x2},${b.cy}`;
  }
  const down = b.cy > a.cy;
  const y1 = down ? a.bottom : a.top;
  const y2 = down ? b.top - 4 : b.bottom + 4;
  const bend = (y2 - y1) / 2;
  return `M${a.cx},${y1} C${a.cx},${y1 + bend} ${b.cx},${y2 - bend} ${b.cx},${y2}`;
}

// Arrowhead colours come from CSS classes, so they follow the theme.
function arrowMarker(id, cls) {
  return s('marker', { id, viewBox: '0 0 10 10', refX: 8, refY: 5, markerWidth: 8, markerHeight: 8, markerUnits: 'userSpaceOnUse', orient: 'auto-start-reverse' },
    s('path', { class: `marker-head ${cls}`, d: 'M0,1 L9,5 L0,9 z' }));
}

// ---- models.js ----
// Chapter: the data. An entity-relationship diagram (same interaction as the
// architecture map) plus a roomy field table for the selected entity.
const CARDINALITY = {
  'has many': ['1', 'N'],
  'has one': ['1', '1'],
  'belongs to': ['N', '1'],
  'many to many': ['N', 'M'],
};

// One edge per pair: "Team has many User" and "User belongs to Team" are the
// same line, so keep the first and drop its mirror.
function relationEdges(models) {
  const names = new Set(models.map((m) => m.name));
  const seen = new Set();
  return models.flatMap((model) => list(model.relations)
    .filter((rel) => names.has(rel.to) && rel.to !== model.name)
    .map((rel) => {
      const key = [model.name, rel.to].sort().join('|');
      if (seen.has(key)) return null;
      seen.add(key);
      const kind = text(rel.kind, 'relates to').toLowerCase();
      return { from: model.name, to: rel.to, kind, ends: CARDINALITY[kind] || ['', ''] };
    })
    .filter(Boolean));
}

// Zig-zag order: start at the most connected entity, then walk neighbours so
// related boxes sit next to each other.
function entityOrder(models, edges) {
  const degree = (name) => edges.filter((e) => e.from === name || e.to === name).length;
  const byDegree = [...models].sort((a, b) => degree(b.name) - degree(a.name));
  const order = [];
  const visit = (model) => {
    if (!model || order.includes(model)) return;
    order.push(model);
    edges.filter((e) => e.from === model.name || e.to === model.name)
      .map((e) => models.find((m) => m.name === (e.from === model.name ? e.to : e.from)))
      .forEach(visit);
  };
  byDegree.forEach(visit);
  return order;
}

// PK: named "id" or noted as primary. FK: explicit `ref`, or "<model>Id" / "<model>_id".
// Ids of outside systems (stripeCustomerId) are not FKs, so no suffix guessing.
function fieldBadges(field, modelNames) {
  const name = text(field.name);
  const lower = name.toLowerCase();
  const isPk = name === 'id' || /\bprimary\b/i.test(text(field.note));
  const named = [...modelNames].find((m) => lower === `${m.toLowerCase()}id` || lower === `${m.toLowerCase()}_id`);
  const fkTarget = modelNames.has(field.ref) ? field.ref : named;
  return { isPk, fkTarget, isFk: Boolean(fkTarget) };
}

function renderModels(data, mount) {
  const models = list(data.dataModel);
  const edges = relationEdges(models);
  const ordered = entityOrder(models, edges);
  const modelNames = new Set(models.map((m) => m.name));
  const svg = s('svg', { class: 'map-edges', 'aria-hidden': 'true' });
  const grid = h('div', { class: 'er-grid', style: `--er-cols:${ordered.length + 1}` },
    ordered.map((model, i) => entityBox(model, i, modelNames, () => pick(model.name))));
  const canvas = h('div', { class: 'map-canvas er-canvas', style: `--er-cols:${ordered.length + 1}` }, svg, grid);
  const detail = h('div', { class: 'panel er-detail', 'aria-live': 'polite' });
  let selected = ordered[0] ? ordered[0].name : null;

  function select(name) {
    selected = name;
    paint();
    fill(detail, ...modelDetail(models.find((m) => m.name === name)));
  }

  function pick(name) {
    select(name);
    setDeepLink(`data/${linkPart(name)}`);
  }

  function paint() {
    const related = new Set(edges.filter((e) => e.from === selected || e.to === selected).flatMap((e) => [e.from, e.to]));
    canvas.classList.add('has-selection');
    grid.querySelectorAll('.entity').forEach((el) => {
      el.classList.toggle('is-selected', el.dataset.entity === selected);
      el.classList.toggle('is-related', related.has(el.dataset.entity));
      el.setAttribute('aria-pressed', String(el.dataset.entity === selected));
    });
    svg.querySelectorAll('[data-edge]').forEach((g) => {
      const [from, to] = g.dataset.edge.split('→');
      const active = from === selected || to === selected;
      g.querySelectorAll('path, text').forEach((part) => part.classList.toggle('is-active', active));
    });
  }

  function modelDetail(model) {
    if (!model) return [];
    const rels = edges.filter((e) => e.from === model.name || e.to === model.name);
    return [
      h('div', { class: 'er-detail-head' },
        h('h3', null, h('span', { class: 'detail-icon' }, icon('db')), h('span', null, softBreaks(model.name))),
        model.summary && h('p', null, softBreaks(model.summary))),
      h('div', { class: 'er-fields', role: 'table', 'aria-label': `${model.name} fields` },
        h('div', { class: 'er-row er-row-head', role: 'row' },
          h('span', { role: 'columnheader' }, 'Field'), h('span', { role: 'columnheader' }, 'Type'), h('span', { role: 'columnheader' }, 'Meaning')),
        list(model.fields).map((field) => fieldRow(field, modelNames, pick))),
      rels.length > 0 && h('div', { class: 'er-rels' },
        h('p', { class: 'eyebrow quiet' }, 'Relationships'),
        h('ul', { class: 'rel' }, rels.map((edge) => {
          const other = edge.from === model.name ? edge.to : edge.from;
          const [a, b] = edge.from === model.name ? edge.ends : [...edge.ends].reverse();
          return h('li', null,
            tag(`${a || '?'} : ${b || '?'}`),
            h('span', null, softBreaks(`${model.name} ${edge.from === model.name ? edge.kind : 'is linked from'} `)),
            h('button', { class: 'link', type: 'button', onclick: () => pick(other) }, softBreaks(other)));
        }))),
    ];
  }

  function drawEdges() {
    const box = canvas.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
    fill(svg, s('defs', null), edges.map((edge) => relationShape(edge, grid, box)).filter(Boolean));
    paint();
  }

  if (!models.length) return null;
  mount.append(h('div', { class: 'panel map-panel' }, h('div', { class: 'map-scroll' }, canvas)), detail);
  select(selected);
  const redraw = () => window.requestAnimationFrame(drawEdges);
  new ResizeObserver(redraw).observe(canvas);
  if (document.fonts) document.fonts.ready.then(redraw);
  return {
    open([name] = []) {
      if (name !== undefined && modelNames.has(name)) select(name);
      return null;
    },
  };
}

function entityBox(model, index, modelNames, onSelect) {
  // Zig-zag: each box spans two tracks and steps one track right, alternating rows.
  const row = index % 2;
  const col = index + 1;
  const keys = list(model.fields).filter((f) => {
    const b = fieldBadges(f, modelNames);
    return b.isPk || b.isFk;
  }).slice(0, 4);
  return h('button', {
    class: 'entity', type: 'button', 'data-entity': model.name, 'aria-pressed': 'false',
    style: `grid-column:${col} / span 2;grid-row:${row + 1}`, onclick: onSelect,
  },
  h('span', { class: 'entity-head' }, h('span', { class: 'node-icon' }, icon('db')), h('span', { class: 'entity-name' }, softBreaks(model.name)), h('span', { class: 'entity-count' }, `${list(model.fields).length} fields`)),
  keys.length > 0 && h('span', { class: 'entity-keys' }, keys.map((f) => {
    const b = fieldBadges(f, modelNames);
    return h('span', { class: 'entity-key' }, h('span', { class: `key-badge ${b.isPk ? 'is-pk' : 'is-fk'}` }, b.isPk ? 'PK' : 'FK'), h('span', null, softBreaks(f.name)));
  })));
}

function fieldRow(field, modelNames, select) {
  const b = fieldBadges(field, modelNames);
  return h('div', { class: 'er-row', role: 'row' },
    h('span', { class: 'er-name', role: 'cell' },
      h('code', null, field.name),
      b.isPk && h('span', { class: 'key-badge is-pk' }, 'PK'),
      b.isFk && h('span', { class: 'key-badge is-fk' }, 'FK'),
      b.fkTarget && h('button', { class: 'link er-fk', type: 'button', onclick: () => select(b.fkTarget) }, `→ ${b.fkTarget}`)),
    h('span', { class: 'er-type', role: 'cell' }, h('code', null, text(field.type, 'any'))),
    h('span', { class: 'er-note', role: 'cell' }, softBreaks(text(field.note, ''))));
}

function relationShape(edge, grid, box) {
  const fromEl = grid.querySelector(`[data-entity="${CSS.escape(edge.from)}"]`);
  const toEl = grid.querySelector(`[data-entity="${CSS.escape(edge.to)}"]`);
  if (!fromEl || !toEl) return null;
  const a = relativeRect(fromEl, box);
  const b = relativeRect(toEl, box);
  const d = connectorPath(a, b);
  const nums = d.match(/-?\d+(\.\d+)?/g).map(Number);
  const [x1, y1] = nums;
  const [x2, y2] = nums.slice(-2);
  const nudge = (x, y, tx, ty) => {
    const len = Math.hypot(tx - x, ty - y) || 1;
    return { x: x + ((tx - x) / len) * 18 + 8, y: y + ((ty - y) / len) * 18 - 4 };
  };
  const startLabel = nudge(x1, y1, x2, y2);
  const endLabel = nudge(x2, y2, x1, y1);
  return s('g', { 'data-edge': `${edge.from}→${edge.to}` },
    s('path', { class: 'edge', d }),
    s('text', { class: 'er-card', x: startLabel.x, y: startLabel.y, 'text-anchor': 'middle' }, edge.ends[0]),
    s('text', { class: 'er-card', x: endLabel.x, y: endLabel.y, 'text-anchor': 'middle' }, edge.ends[1]),
    s('text', { class: 'edge-label', x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 8, 'text-anchor': 'middle' }, edge.kind));
}

// ---- flow.js ----
// Chapter: end-to-end flow player. A sequence diagram you step through one
// hop at a time, Brilliant style: one idea per step and a Continue button.
const SEQ = { minCol: 130, maxCol: 220, head: 64, top: 40, row: 58, pad: 20 };
const DASHED_KINDS = new Set(['response', 'async']);
const FLOW_SIDE_BY_SIDE = '(min-width: 1180px)';
const FLOW_CARD_WIDTH = 380;
const LABEL_CHAR = 6.6;

function renderFlows(data, mount) {
  const flows = list(data.flows);
  if (!flows.length) {
    mount.append(h('p', { class: 'empty' }, 'No flows traced yet.'));
    return null;
  }
  const nodeIndex = byId(data.nodes);
  let state = { flowIndex: 0, stepIndex: 0, finished: false, direction: 1 };

  const picker = h('ul', { class: 'flow-list', 'aria-label': 'Flows' });
  const meta = h('div', { class: 'flow-meta' });
  const headsWrap = h('div', { class: 'seq-heads-wrap' });
  const bodyWrap = h('div', { class: 'seq-body' });
  const seqWrap = h('div', { class: 'panel seq-wrap seq', 'aria-label': 'Sequence diagram' }, headsWrap, bodyWrap);
  // The body scrolls sideways only; the sticky header strip follows it.
  bodyWrap.addEventListener('scroll', () => {
    if (headsWrap.firstElementChild) headsWrap.firstElementChild.style.transform = `translateX(${-bodyWrap.scrollLeft}px)`;
  }, { passive: true });
  const panel = h('div', { class: 'panel step-card', 'aria-live': 'polite' });
  const layout = h('div', { class: 'flow-layout' }, seqWrap, panel);
  const root = h('div', { class: 'flow-player' }, picker, meta, layout);
  // Side by side only when the widest flow fits beside the step card without
  // sideways scrolling; otherwise the card comes first and the diagram gets
  // the full width. Decided for the whole page, so flows do not jump around.
  const widest = Math.max(...flows.map((f) => flowActors(list(f.steps)).length), 1);
  const fitsBeside = () => window.matchMedia(FLOW_SIDE_BY_SIDE).matches
    && root.clientWidth - FLOW_CARD_WIDTH - 16 >= widest * SEQ.minCol + SEQ.pad * 2;
  let lastWidth = 0;
  new ResizeObserver(() => {
    if (Math.abs(root.clientWidth - lastWidth) <= 24) return;
    lastWidth = root.clientWidth;
    layout.classList.toggle('is-stacked', !fitsBeside());
    render();
  }).observe(root);
  // The step card follows the reader only while it fits on screen: no inner scroll areas.
  new ResizeObserver(() => {
    panel.classList.toggle('is-static', panel.offsetHeight > window.innerHeight - 96);
  }).observe(panel);

  function setState(next) {
    state = { ...state, ...next };
    const flow = flows[state.flowIndex];
    const step = state.finished ? list(flow.steps).length : state.stepIndex + 1;
    setDeepLink(`flows/${linkPart(flow.id)}/${step}`);
    render({ animate: true });
  }

  function go(stepIndex) {
    const steps = list(flows[state.flowIndex].steps);
    if (stepIndex >= steps.length) return setState({ finished: true, direction: 1 });
    return setState({ stepIndex: Math.max(0, stepIndex), finished: false, direction: stepIndex >= state.stepIndex ? 1 : -1 });
  }

  function render({ animate = false } = {}) {
    const flow = flows[state.flowIndex];
    fill(picker, ...flows.map((f, i) => h('li', null, h('button', {
      class: 'flow-pick', type: 'button', 'aria-pressed': String(i === state.flowIndex),
      onclick: () => setState({ flowIndex: i, stepIndex: 0, finished: false }),
    },
    h('span', { class: 'flow-pick-top' }, h('span', null, padNumber(i + 1)), h('span', null, `${list(f.steps).length} steps`)),
    h('span', { class: `flow-pick-title ${fitClass(f.title)}` }, softBreaks(f.title))))));
    fill(meta,
      flow.trigger && h('p', { class: 'flow-trigger' }, h('span', { class: 'eyebrow quiet' }, 'Starts when'), h('span', null, softBreaks(flow.trigger))),
      flow.summary && h('p', { class: 'flow-summary' }, softBreaks(flow.summary)));
    const diagram = sequenceDiagram(flow, nodeIndex, state.finished ? list(flow.steps).length : state.stepIndex, go, bodyWrap.clientWidth);
    fill(headsWrap, diagram.heads);
    fill(bodyWrap, diagram.body);
    centerCurrentStep(bodyWrap, animate);
    fill(panel, ...(state.finished ? finishedPanel(flow) : stepPanel(flow)));
    const current = diagram.body.querySelector('.seq-step.is-current .arrow');
    if (current) {
      const marker = current.dataset.marker;
      if (animate) drawPath(current, marker); else current.setAttribute('marker-end', marker);
    }
    if (animate) slideIn(panel.firstElementChild, state.direction);
    // Stacked layouts keep the reader at the Continue button instead.
    if (animate && !state.finished && !layout.classList.contains('is-stacked')) revealCurrentStep(diagram.body);
    if (animate && state.finished) pop(panel.querySelector('.trophy'));
  }

  function stepPanel(flow) {
    const steps = list(flow.steps);
    const step = steps[state.stepIndex];
    const from = nodeIndex.get(step.from);
    const to = nodeIndex.get(step.to);
    const last = state.stepIndex === steps.length - 1;
    return [h('div', { class: 'step-body' }, h('div', { class: 'step-text' },
      h('div', { class: 'step-top' },
        h('span', { class: 'step-count' }, `Step ${state.stepIndex + 1} of ${steps.length}`),
        step.kind && tag(step.kind, `tag-${step.kind}`)),
      h('div', { class: 'step-route' },
        h('span', { class: 'route-part' }, from && icon(from.kind), softBreaks(text(from && from.label, step.from))),
        h('span', { class: 'arrow-glyph', 'aria-hidden': 'true' }, step.from === step.to ? '↺' : '→'),
        step.from !== step.to && h('span', { class: 'route-part' }, to && icon(to.kind), softBreaks(text(to && to.label, step.to)))),
      h('h3', null, softBreaks(step.label)),
      step.detail && h('p', null, softBreaks(step.detail)),
      step.why && h('div', { class: 'why' }, h('p', { class: 'eyebrow quiet' }, 'Why it works this way'), h('p', null, softBreaks(step.why)))),
      (step.file || step.code) && h('div', { class: 'step-code' },
        step.file && h('div', { class: 'code-head' }, fileChip(step.file)),
        step.code && codeBlock(step.code, step.lang))),
      h('div', { class: 'step-controls' },
        stepDots(steps.length, state.stepIndex, go),
        h('button', { class: 'btn', type: 'button', disabled: state.stepIndex === 0, onclick: () => go(state.stepIndex - 1) }, 'Back'),
        h('button', { class: 'btn primary', type: 'button', onclick: () => go(state.stepIndex + 1) }, last ? 'Finish' : 'Continue')),
      h('p', { class: 'kbd-hint' }, 'Tip: use ', h('kbd', null, '←'), ' ', h('kbd', null, '→'), ' to step through.'),
    ];
  }

  function finishedPanel(flow) {
    const steps = list(flow.steps);
    const actors = new Set(steps.flatMap((st) => [st.from, st.to]));
    const nextIndex = state.flowIndex + 1;
    return [h('div', { class: 'flow-done' },
      h('span', { class: 'trophy' }, icon('trophy')),
      h('p', { class: 'eyebrow quiet' }, 'Flow complete'),
      h('h3', null, softBreaks(flow.title)),
      h('p', null, `You followed it through ${steps.length} steps and ${actors.size} parts of the system.`),
      h('div', { class: 'btn-row' },
        h('button', { class: 'btn', type: 'button', onclick: () => go(0) }, 'Replay'),
        nextIndex < flows.length && h('button', { class: 'btn primary', type: 'button', onclick: () => setState({ flowIndex: nextIndex, stepIndex: 0, finished: false }) }, 'Next flow')))];
  }

  root.addEventListener('keydown', (event) => {
    if (event.target.closest('input, textarea')) return;
    if (event.key === 'ArrowRight') { event.preventDefault(); go(state.stepIndex + 1); }
    if (event.key === 'ArrowLeft') { event.preventDefault(); go(state.finished ? state.stepIndex : state.stepIndex - 1); }
  });

  render();
  mount.append(root);
  return {
    open([flowId, n] = []) {
      if (flowId === undefined) return null;
      const index = flows.findIndex((f) => f.id === flowId);
      if (index < 0) return null;
      const count = list(flows[index].steps).length;
      const wanted = Number.parseInt(n, 10);
      const stepIndex = Number.isInteger(wanted) && wanted >= 1 && wanted <= count ? wanted - 1 : 0;
      state = { flowIndex: index, stepIndex, finished: false, direction: 1 };
      render();
      return null;
    },
  };
}

// A segmented progress bar. Each segment is a button with a full-height hit area.
function stepDots(count, current, go) {
  return h('div', { class: 'step-dots' }, Array.from({ length: count }, (_, i) => h('button', {
    type: 'button', class: i === current ? 'is-current' : i < current ? 'is-done' : '', 'aria-label': `Go to step ${i + 1}`,
    'aria-current': i === current ? 'step' : null, onclick: () => go(i),
  })));
}

function flowActors(steps) {
  return [...new Set(steps.flatMap((step) => [step.from, step.to]))];
}

// Two SVGs share one scroll box: a sticky strip of actor heads and the steps.
function sequenceDiagram(flow, nodeIndex, currentIndex, go, available) {
  const steps = list(flow.steps);
  const actors = flowActors(steps);
  const fit = ((available || 0) - SEQ.pad * 2) / Math.max(actors.length, 1);
  const col = Math.min(SEQ.maxCol, Math.max(SEQ.minCol, fit));
  const width = SEQ.pad * 2 + actors.length * col;
  const height = SEQ.top + steps.length * SEQ.row;
  const xOf = (id) => SEQ.pad + actors.indexOf(id) * col + col / 2;
  const headW = Math.min(col - 16, 170);
  const chars = Math.floor((headW - 46) / 7);
  const heads = s('svg', { class: 'seq-heads', viewBox: `0 0 ${width} ${SEQ.head}`, width, height: SEQ.head, 'aria-hidden': 'true' });
  const body = s('svg', { viewBox: `0 0 ${width} ${height}`, width, height, role: 'img', 'aria-label': `${flow.title}: ${steps.length} steps` });

  actors.forEach((id) => {
    const node = nodeIndex.get(id);
    const x = xOf(id);
    heads.append(
      s('rect', { class: 'seq-head-box', x: x - headW / 2 + 0.5, y: 12.5, width: headW - 1, height: 40, rx: 6 }),
      icon(node ? node.kind : 'service', { class: 'seq-head-icon', x: x - headW / 2 + 10, y: 22, width: 20, height: 20 }),
      s('text', { class: 'seq-head-label', x: x - headW / 2 + 38, y: 37 }, truncate(node ? node.label : id, chars), s('title', null, node ? node.label : id)),
    );
    body.append(s('line', { class: 'seq-lifeline', x1: x, x2: x, y1: 0, y2: height }));
  });

  steps.forEach((step, i) => body.append(sequenceStep(step, i, currentIndex, xOf, width, go, col)));
  return { heads, body };
}

function sequenceStep(step, i, currentIndex, xOf, width, go, col) {
  const y = SEQ.top + i * SEQ.row;
  const status = i < currentIndex ? 'is-done' : i === currentIndex ? 'is-current' : 'is-todo';
  const x1 = xOf(step.from);
  const x2 = xOf(step.to);
  const self = step.from === step.to;
  const dir = x2 >= x1 ? 1 : -1;
  const d = self
    ? `M${x1},${y} h44 v18 h-40`
    : `M${x1 + dir * 12},${y} L${x2 - dir * 8},${y}`;
  // A label may run past a short hop, but always stays inside the diagram.
  const room = self ? width - (x1 + 52) - SEQ.pad : Math.max(Math.abs(x2 - x1), col * 1.6) - 12;
  const label = truncate(step.label, Math.max(10, Math.floor(room / LABEL_CHAR)));
  const half = (label.length * LABEL_CHAR) / 2;
  const labelX = self ? x1 + 52 : Math.min(Math.max((x1 + x2) / 2, half + 6), width - half - 6);
  const group = s('g', {
    class: `seq-step ${status}${DASHED_KINDS.has(step.kind) ? ' is-dashed' : ''}`,
    role: 'button', tabindex: '0', 'aria-label': `Step ${i + 1}: ${step.label}`,
    onclick: () => go(i),
    onkeydown: (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); go(i); } },
  },
  s('rect', { class: 'hit', x: 4, y: y - 30, width: width - 8, height: SEQ.row - 4, rx: 6 }),
  s('path', status === 'is-current'
    ? { class: 'arrow', d, 'data-marker': `url(#seq-arrow-${status})` }
    : { class: 'arrow', d, 'marker-end': `url(#seq-arrow-${status})` }),
  s('circle', { class: 'badge-bg', cx: x1, cy: y, r: 10 }),
  s('text', { class: 'badge-num', x: x1, y: y + 3.5, 'text-anchor': 'middle' }, String(i + 1)),
  s('text', { class: 'label', x: labelX, y: y - 10, 'text-anchor': self ? 'start' : 'middle' }, label, s('title', null, step.label)));

  if (i === 0) group.prepend(seqMarkers());
  if (status === 'is-current' && !reducedMotion()) {
    // One pass along the arrow after it draws, then fade. No endless loop.
    group.append(s('circle', { class: 'seq-dot', r: 4.5, opacity: 0 },
      s('set', { attributeName: 'opacity', to: 1, begin: '0.3s' }),
      s('animateMotion', { dur: '0.6s', begin: '0.3s', fill: 'freeze', path: d, calcMode: 'spline', keyTimes: '0;1', keySplines: '0.4 0 0.2 1' }),
      s('animate', { attributeName: 'opacity', from: 1, to: 0, begin: '0.9s', dur: '0.3s', fill: 'freeze' })));
  }
  return group;
}

function seqMarkers() {
  const marker = (status) => s('marker', { id: `seq-arrow-${status}`, viewBox: '0 0 10 10', refX: 7, refY: 5, markerWidth: 8, markerHeight: 8, markerUnits: 'userSpaceOnUse', orient: 'auto' },
    s('path', { class: `marker-head ${status}`, d: 'M0,1 L9,5 L0,9 z' }));
  return s('defs', null, marker('is-done'), marker('is-current'), marker('is-todo'));
}

// Only on reader actions: bring the active hop into view without fighting
// the page's own scrolling.
function centerCurrentStep(bodyWrap, animate) {
  const badge = bodyWrap.querySelector('.seq-step.is-current .badge-bg');
  if (!badge) return;
  const left = Number(badge.getAttribute('cx')) - bodyWrap.clientWidth / 3;
  bodyWrap.scrollTo({ left: Math.max(0, left), behavior: animate && !reducedMotion() ? 'smooth' : 'auto' });
}

function revealCurrentStep(diagram) {
  const current = diagram.querySelector('.seq-step.is-current');
  if (!current) return;
  const box = current.getBoundingClientRect();
  const stickyBottom = 100;
  if (box.top < stickyBottom || box.bottom > window.innerHeight - 24) {
    current.scrollIntoView({ block: 'center', behavior: reducedMotion() ? 'auto' : 'smooth' });
  }
}

// ---- changes.js ----
// Chapter: what changed and why. Built for repos where many humans and
// agents merge every day. Each change carries its reason and the parts of
// the system it touched, so readers can re-sync their mental model fast.
const AUTHOR_FILTERS = [
  { id: 'all', label: 'Everyone' },
  { id: 'agent', label: 'Agents' },
  { id: 'human', label: 'Humans' },
];

// The deep-link key for a change: its id, else its position in the data.
function changeKey(change, index) {
  return text(change && change.id, String(index));
}

function renderChanges(data, mount) {
  const changes = list(data.changes)
    .map((change, i) => ({ ...change, key: changeKey(change, i) }))
    .sort((a, b) => String(b.date).localeCompare(String(a.date)));
  if (!changes.length) {
    mount.append(h('p', { class: 'empty' }, 'No recent changes recorded.'));
    return null;
  }
  const nodeIndex = byId(data.nodes);
  let state = { author: 'all', kind: 'all', target: null };

  const kinds = ['all', ...new Set(changes.map((c) => c.kind).filter(Boolean))];
  const toolbar = h('div', { class: 'changes-toolbar' });
  const timeline = h('ol', { class: 'timeline' });

  function setState(next, { animate = true } = {}) {
    state = { ...state, ...next };
    render();
    if (animate) [...timeline.children].slice(0, 8).forEach((item, i) => riseIn(item, i * 35));
  }

  function visible() {
    return changes.filter((c) => (state.author === 'all' || c.authorType === state.author)
      && (state.kind === 'all' || c.kind === state.kind));
  }

  function render() {
    fill(toolbar,
      h('div', { class: 'seg', role: 'group', 'aria-label': 'Filter by author' },
        AUTHOR_FILTERS.map((f) => filterChip(f.label, state.author === f.id, () => setState({ author: f.id })))),
      kinds.length > 2 && h('div', { class: 'seg', role: 'group', 'aria-label': 'Filter by type' },
        kinds.map((k) => filterChip(k === 'all' ? 'All types' : k, state.kind === k, () => setState({ kind: k })))),
      h('button', {
        class: 'btn small changes-map', type: 'button',
        onclick: () => { emit('highlight-changes', { enabled: true }); window.location.hash = 'map'; },
      }, 'Show on map'),
    );
    const items = visible();
    fill(timeline, ...(items.length
      ? items.map((change) => changeItem(change, nodeIndex, change.key === state.target))
      : [h('li', { class: 'empty' }, 'Nothing matches these filters.')]));
  }

  render();
  mount.append(changeStats(changes), toolbar, timeline);
  return {
    open([key] = []) {
      const match = key !== undefined && changes.find((c) => c.key === key);
      setState({ author: 'all', kind: 'all', target: match ? match.key : null }, { animate: false });
      return match ? timeline.querySelector('.change.is-target') : null;
    },
  };
}

function filterChip(label, pressed, onclick) {
  return h('button', { class: 'seg-option', type: 'button', 'aria-pressed': String(pressed), onclick }, label);
}

function changeStats(changes) {
  const agents = changes.filter((c) => c.authorType === 'agent').length;
  const touched = new Set(changes.flatMap((c) => list(c.nodes))).size;
  const stat = (value, label) => h('div', null, h('dt', null, label), h('dd', null, String(value)));
  return h('dl', { class: 'panel glance-grid changes-stats' },
    stat(changes.length, 'Changes'),
    stat(agents, 'By agents'),
    stat(changes.length - agents, 'By humans'),
    stat(touched, 'Parts touched'));
}

function changeItem(change, nodeIndex, isTarget) {
  const isAgent = change.authorType === 'agent';
  const url = safeUrl(change.url);
  return h('li', { class: `change ${isAgent ? 'is-agent' : 'is-human'}${isTarget ? ' is-target' : ''}`, 'data-change': change.key },
    h('div', { class: 'change-dot', 'aria-hidden': 'true' }, icon(isAgent ? 'robot' : 'user')),
    h('article', { class: 'panel change-card' },
      h('div', { class: 'change-top' },
        h('span', null, formatDate(change.date)),
        change.ref && (url
          ? h('a', { class: 'link', href: safeUrl(change.url), target: '_blank', rel: 'noopener noreferrer' }, softBreaks(change.ref))
          : h('span', null, softBreaks(change.ref))),
        tag(isAgent ? 'Agent' : 'Human', isAgent ? 'tag-agent' : 'tag-human'),
        change.author && h('span', null, softBreaks(change.author)),
        change.kind && tag(change.kind)),
      h('h3', null, softBreaks(change.title)),
      change.what && h('p', null, softBreaks(change.what)),
      change.why && h('div', { class: 'why' }, h('p', { class: 'eyebrow quiet' }, 'Why'), h('p', null, softBreaks(change.why))),
      change.risk && h('div', { class: 'why why-risk' }, h('p', { class: 'eyebrow quiet' }, 'Risk'), h('p', null, softBreaks(change.risk))),
      list(change.nodes).length > 0 && h('div', { class: 'change-nodes' }, list(change.nodes).map((id) => {
        const node = nodeIndex.get(id);
        return h('a', { class: 'chip', href: `#map/${linkPart(id)}` }, truncatable(h('span', { class: 'chip-text' }, softBreaks(node ? node.label : id)), node ? node.label : id));
      })),
      list(change.files).length > 0 && h('div', { class: 'change-nodes' }, list(change.files).slice(0, 6).map(fileChip))));
}

function formatDate(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return text(value, 'undated');
  return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
}

// ---- lessons.js ----
// Chapter: key concepts, one idea per card. (The quiz follows.)
function renderConcepts(data, mount) {
  const concepts = list(data.concepts);
  if (!concepts.length) return null;
  let index = 0;
  const card = h('article', { class: 'panel concept-card', 'aria-live': 'polite' });
  const controls = h('div', { class: 'step-controls' });

  function show(next, { animate = true, link = true } = {}) {
    const target = Math.min(Math.max(next, 0), concepts.length - 1);
    const direction = target >= index ? 1 : -1;
    index = target;
    render();
    if (link) setDeepLink(`concepts/${index}`);
    if (animate) slideIn(card, direction);
  }

  function render() {
    const concept = concepts[index];
    fill(card,
      h('span', { class: 'step-count' }, `Idea ${index + 1} of ${concepts.length}`),
      h('h3', null, softBreaks(concept.title)),
      h('p', { class: 'concept-body' }, softBreaks(concept.body)),
      concept.analogy && h('div', { class: 'why' }, h('p', { class: 'eyebrow quiet' }, 'Think of it like'), h('p', null, softBreaks(concept.analogy))),
      concept.file && h('div', { class: 'code-head' }, fileChip(concept.file)),
      concept.code && codeBlock(concept.code, concept.lang),
      controls,
    );
    fill(controls,
      stepDots(concepts.length, index, (i) => show(i)),
      h('button', { class: 'btn', type: 'button', disabled: index === 0, onclick: () => show(index - 1) }, 'Back'),
      h('button', { class: 'btn primary', type: 'button', disabled: index === concepts.length - 1, onclick: () => show(index + 1) }, 'Continue'),
    );
  }

  render();
  mount.append(h('div', { class: 'lesson' }, card));
  return {
    open([raw] = []) {
      const wanted = Number.parseInt(raw, 10);
      if (Number.isInteger(wanted) && wanted >= 0 && wanted < concepts.length) show(wanted, { animate: false, link: false });
      return null;
    },
  };
}

// Chapter: check yourself. One question at a time, Brilliant pacing: pick an
// answer, then Check. A wrong first try says "Not yet" and lets you retry; a
// second wrong try (or Show answer) reveals the answer and the reason.
// Answers are remembered per explainer in this browser only.
const QUIZ_TRIES = 2;
const PATHISH = /^[^\s]*[/\\][^\s]*$|^[\w.-]+\.(?:[a-z]{1,5})(?::\d+)?$|\(\)|=>|::/i;

function quizStoreKey(meta) {
  return `concept-explainer:quiz:${text(meta && meta.repo, meta && meta.title)}:${text(meta && meta.commit, '')}`;
}

function loadQuiz(key, count) {
  try {
    const saved = JSON.parse(readStore(key) || 'null');
    if (!saved || !Array.isArray(saved.answers)) return null;
    return { index: Math.min(Math.max(0, saved.index | 0), count), answers: saved.answers.slice(0, count) };
  } catch (error) {
    return null;
  }
}

// Where a question is taught: a node or flow named in the question, the
// right option or the explanation; a cited path that belongs to a node.
function quizLesson(question, data) {
  const hay = [question.question, question.explain, list(question.options)[question.answer]].map((v) => text(v)).join(' ').toLowerCase();
  if (!hay) return null;
  const node = list(data.nodes).find((n) => (n.label && hay.includes(String(n.label).toLowerCase()))
    || list(n.files).some((f) => hay.includes(String(f).replace(/:\d+.*$/, '').toLowerCase())));
  if (node) return { href: `#map/${linkPart(node.id)}`, label: node.label };
  const flow = list(data.flows).find((f) => f.title && hay.includes(String(f.title).toLowerCase()));
  if (flow) return { href: `#flows/${linkPart(flow.id)}`, label: flow.title };
  const concept = list(data.concepts).findIndex((c) => c.title && hay.includes(String(c.title).toLowerCase()));
  if (concept >= 0) return { href: `#concepts/${concept}`, label: data.concepts[concept].title };
  return null;
}

function optionLabel(option) {
  const value = String(option);
  if (PATHISH.test(value.trim())) {
    return truncatable(h('span', { class: 'option-text is-code' }), value, { mode: 'middle' });
  }
  return h('span', { class: 'option-text' }, softBreaks(value));
}

function renderQuiz(data, mount) {
  const questions = list(data.quiz);
  if (!questions.length) return null;
  const key = quizStoreKey(data.meta);
  const saved = loadQuiz(key, questions.length);
  let state = saved || { index: 0, answers: [] };
  const card = h('article', { class: 'panel quiz-card' });

  const answerOf = (i) => state.answers[i] || { tries: [], status: 'open', picked: null };
  const persist = () => writeStore(key, JSON.stringify({ index: state.index, answers: state.answers }));

  function setAnswer(i, next) {
    const answers = [...state.answers];
    answers[i] = { ...answerOf(i), ...next };
    state = { ...state, answers };
    persist();
  }

  function go(index, { focus = true, link = true } = {}) {
    state = { ...state, index: Math.min(Math.max(index, 0), questions.length) };
    persist();
    if (link) setDeepLink(state.index >= questions.length ? 'quiz/done' : `quiz/${state.index + 1}`);
    render({ focus });
  }

  function reset() {
    state = { index: 0, answers: [] };
    persist();
    go(0);
  }

  function render({ focus = false } = {}) {
    fill(card, ...(state.index >= questions.length ? endScreen() : questionScreen(state.index)));
    if (focus) {
      const head = card.querySelector('[data-focus]');
      if (head) head.focus({ preventScroll: true });
    }
  }

  function progress(current) {
    return h('div', { class: 'step-dots quiz-dots' }, questions.map((_, i) => {
      const status = answerOf(i).status;
      return h('button', {
        type: 'button', class: [i === current ? 'is-current' : '', status !== 'open' ? 'is-done' : ''].join(' ').trim(),
        'aria-label': `Question ${i + 1}${status === 'right' ? ', right' : status === 'missed' ? ', missed' : ''}`,
        'aria-current': i === current ? 'step' : null, onclick: () => go(i),
      });
    }));
  }

  function questionScreen(i) {
    const question = questions[i];
    const options = list(question.options);
    const answer = answerOf(i);
    const resolved = answer.status === 'right' || answer.status === 'missed';
    const optionEls = options.map((option, j) => {
      const tried = answer.tries.includes(j);
      const isAnswer = resolved && j === question.answer;
      const el = h('button', {
        class: ['option', tried && !isAnswer ? 'is-tried' : '', isAnswer ? 'is-answer' : ''].join(' ').trim(),
        type: 'button', role: 'radio', 'aria-checked': String(answer.picked === j), tabindex: '-1', disabled: resolved,
        onclick: () => pick(j),
      },
      h('span', { class: 'key' }, String(j + 1)), optionLabel(option),
      isAnswer && h('span', { class: 'tag tag-answer' }, 'Correct answer'),
      tried && !isAnswer && h('span', { class: 'option-note' }, 'Your try'));
      return el;
    });
    const focusable = optionEls[answer.picked ?? 0] || optionEls[0];
    if (focusable && !resolved) focusable.tabIndex = 0;

    function pick(j) {
      setAnswer(i, { picked: j });
      render();
      const el = card.querySelectorAll('.option')[j];
      if (el) el.focus();
    }

    function check() {
      const current = answerOf(i);
      if (current.picked === null || current.picked === undefined) return;
      const right = current.picked === question.answer;
      const tries = [...current.tries, current.picked];
      const status = right ? (tries.length === 1 ? 'right' : 'right-late') : tries.length >= QUIZ_TRIES ? 'missed' : 'retry';
      setAnswer(i, { tries, status: status === 'right-late' ? 'missed' : status, firstTry: right && tries.length === 1, picked: right ? current.picked : null, late: status === 'right-late' });
      render({ focus: true });
      const chosen = card.querySelectorAll('.option')[tries[tries.length - 1]];
      if (chosen) { if (right) pop(chosen); else shake(chosen); }
    }

    const group = h('div', {
      class: 'options', role: 'radiogroup', 'aria-label': question.question,
      onkeydown: (event) => {
        if (resolved) return;
        const move = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[event.key];
        const number = Number.parseInt(event.key, 10);
        if (move) {
          event.preventDefault();
          const from = answerOf(i).picked ?? -1;
          pick((from + move + options.length) % options.length);
        } else if (number >= 1 && number <= options.length) {
          event.preventDefault();
          pick(number - 1);
        } else if (event.key === 'Enter' && answerOf(i).picked !== null && answerOf(i).picked !== undefined) {
          event.preventDefault();
          check();
        }
      },
    }, optionEls);

    const feedback = feedbackPanel(question, answer);
    const checkButton = !resolved && h('button', {
      class: 'btn primary', type: 'button', disabled: answer.picked === null || answer.picked === undefined, onclick: check,
    }, answer.status === 'retry' ? 'Check again' : 'Check');
    const showAnswer = answer.status === 'retry' && h('button', {
      class: 'link quiz-reveal', type: 'button',
      onclick: () => { setAnswer(i, { status: 'missed', picked: null }); render({ focus: true }); },
    }, 'Show answer');
    const last = i === questions.length - 1;
    return [
      h('div', { class: 'quiz-top' },
        h('span', { class: 'step-count' }, `Question ${i + 1} of ${questions.length}`),
        h('button', { class: 'link quiz-reset', type: 'button', onclick: reset }, 'Reset')),
      progress(i),
      h('h3', { class: 'quiz-q', tabindex: '-1', 'data-focus': answer.status === 'open' ? '' : null }, softBreaks(question.question)),
      group,
      feedback,
      h('div', { class: 'step-controls quiz-controls' },
        h('button', { class: 'btn', type: 'button', disabled: i === 0, onclick: () => go(i - 1) }, 'Back'),
        showAnswer,
        resolved
          ? h('button', { class: 'btn primary', type: 'button', onclick: () => go(i + 1) }, last ? 'See your score' : 'Continue')
          : checkButton),
      h('p', { class: 'kbd-hint' }, 'Tip: press ', h('kbd', null, '1'), ' to ', h('kbd', null, String(options.length)), ' to pick, ', h('kbd', null, 'Enter'), ' to check.'),
    ];
  }

  function feedbackPanel(question, answer) {
    const live = h('div', { class: 'quiz-live', 'aria-live': 'polite' });
    if (answer.status === 'open') return live;
    const correctText = list(question.options)[question.answer];
    const explain = text(question.explain, `The answer is “${correctText}”.`);
    const states = {
      retry: { cls: 'is-retry', head: 'Not yet. Try again.', body: 'Pick another answer, or show the answer.' },
      right: { cls: 'is-right', head: 'Right', body: explain },
      missed: { cls: 'is-missed', head: answer.late ? 'Right on the second try' : 'Why', body: explain },
    };
    const view = states[answer.status] || states.missed;
    live.append(h('div', { class: `feedback ${view.cls}` },
      h('p', { class: 'feedback-head', tabindex: '-1', 'data-focus': '' }, h('span', { class: 'status-dot', 'aria-hidden': 'true' }), view.head),
      h('p', null, softBreaks(view.body))));
    return live;
  }

  function endScreen() {
    const firstTry = questions.filter((_, i) => answerOf(i).status === 'right').length;
    const missed = questions.map((q, i) => ({ q, i, a: answerOf(i) })).filter(({ a }) => a.status !== 'right');
    return [
      h('div', { class: 'quiz-top' }, h('span', { class: 'step-count' }, 'Your score'),
        h('button', { class: 'link quiz-reset', type: 'button', onclick: reset }, 'Reset')),
      progress(-1),
      h('h3', { class: 'quiz-score', tabindex: '-1', 'data-focus': '' }, `${firstTry} of ${questions.length} on the first try`),
      h('div', { class: 'meter', 'aria-hidden': 'true' }, h('span', { style: `--share:${firstTry / questions.length}` })),
      missed.length
        ? h('div', { class: 'quiz-missed' },
          h('p', { class: 'eyebrow quiet' }, 'To revisit'),
          h('ul', { class: 'rows' }, missed.map(({ q, i }) => {
            const lesson = quizLesson(q, data);
            return h('li', { class: 'quiz-missed-row' },
              h('button', { class: 'link', type: 'button', onclick: () => go(i) }, softBreaks(`${i + 1}. ${q.question}`)),
              lesson && h('a', { class: 'quiz-lesson', href: lesson.href }, softBreaks(`Read: ${lesson.label}`)));
          })))
        : h('p', { class: 'quiz-perfect' }, 'Every answer right on the first try. This chapter is done.'),
      h('div', { class: 'step-controls quiz-controls' },
        h('button', { class: 'btn', type: 'button', onclick: () => go(questions.length - 1) }, 'Back'),
        h('button', { class: 'btn primary', type: 'button', onclick: reset }, 'Try again')),
    ];
  }

  mount.append(h('div', { class: 'lesson quiz' }, card));
  render();
  return {
    open([n] = []) {
      if (n === 'done') { go(questions.length, { focus: false, link: false }); return null; }
      const wanted = Number.parseInt(n, 10);
      if (Number.isInteger(wanted) && wanted >= 1 && wanted <= questions.length) go(wanted - 1, { focus: false, link: false });
      return null;
    },
  };
}

// ---- picker.js ----
// Pickers in the design system, in place of native selects whose OS popups
// show raw values. Three shapes, one contract: { el, read(), focus() }.
// - optionGroup: a radiogroup of option cards or a segmented row (2 to 4 choices)
// - listboxPicker: a button and a popover listbox (WAI-ARIA listbox pattern)
// - comboPicker: a text field with suggestions and free entry (combobox)
// Each option is { value, label, desc? }; the value is what gets stored.
let pickerSerial = 0;

function pickerId(prefix) {
  pickerSerial += 1;
  return `${prefix}-${pickerSerial}`;
}

/**
 * Radio cards or a segmented row. Arrow keys move and choose; one tab stop.
 * @param {{ options: object[], value: string, labelledBy?: string, describedBy?: string, variant?: 'cards'|'segmented', onChange?: Function, render?: Function }} spec
 */
function optionGroup({ options, value, labelledBy, describedBy, variant = 'segmented', onChange, render }) {
  let current = options.some((o) => o.value === value) ? value : options[0].value;
  const buttons = options.map((option, index) => h('button', {
    type: 'button', role: 'radio', class: `pick-option${variant === 'cards' ? ' is-card' : ''}`, 'data-value': option.value,
    onclick: () => choose(option.value, true),
    onkeydown: (event) => {
      const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[event.key];
      const jump = { Home: 0, End: options.length - 1 }[event.key];
      if (step === undefined && jump === undefined) return;
      event.preventDefault();
      const next = jump !== undefined ? jump : (index + step + options.length) % options.length;
      choose(options[next].value, true);
      buttons[next].focus();
    },
  },
  render ? render(option) : [
    h('span', { class: 'pick-option-label' }, option.label),
    option.desc && variant === 'cards' && h('span', { class: 'pick-option-desc' }, option.desc),
  ]));
  const el = h('div', {
    class: `pick-group is-${variant}`, role: 'radiogroup', 'aria-labelledby': labelledBy, 'aria-describedby': describedBy,
  }, buttons);

  function paint() {
    buttons.forEach((button, i) => {
      const on = options[i].value === current;
      button.setAttribute('aria-checked', String(on));
      button.tabIndex = on ? 0 : -1;
    });
  }

  function choose(next, fromUser) {
    if (next === current && fromUser) return;
    current = next;
    paint();
    if (onChange) onChange(current);
  }

  paint();
  return {
    el,
    read: () => current,
    focus: () => { const on = buttons.find((b) => b.getAttribute('aria-checked') === 'true'); if (on) on.focus(); },
    set: (next) => { if (options.some((o) => o.value === next)) { current = next; paint(); } },
  };
}

// Close the open picker on outside pointer or Escape, one at a time.
const PICKER = { open: null };
document.addEventListener('pointerdown', (event) => {
  if (PICKER.open && !PICKER.open.root.contains(event.target)) PICKER.open.close(false);
});

function placePanel(button, panel) {
  panel.classList.remove('is-up', 'is-end');
  const box = button.getBoundingClientRect();
  const height = panel.offsetHeight;
  if (box.bottom + 8 + height > window.innerHeight - 8 && box.top - 8 - height > 8) panel.classList.add('is-up');
  if (box.left + panel.offsetWidth > window.innerWidth - 8) panel.classList.add('is-end');
}

function optionRow(option, id, selected) {
  return h('div', { class: 'picker-option', role: 'option', id, 'aria-selected': String(selected), 'data-value': option.value },
    h('span', { class: 'picker-check', 'aria-hidden': 'true' }),
    h('span', { class: 'picker-text' },
      h('span', { class: 'picker-label' }, option.label),
      option.desc && h('span', { class: 'picker-desc' }, option.desc)));
}

/**
 * A button that opens a listbox popover. Up/Down, Home/End, typeahead,
 * Enter/Space choose, Escape closes and returns focus to the button.
 * @param {{ options: object[], value: string, labelledBy: string, describedBy?: string, onChange?: Function }} spec
 */
function listboxPicker({ options, value, labelledBy, describedBy, onChange, ariaLabel, buttonContent }) {
  const buttonId = pickerId('picker-button');
  const listId = pickerId('picker-list');
  let current = options.some((o) => o.value === value) ? value : options[0].value;
  let active = 0;
  let typed = '';
  let typedAt = 0;
  const labelOf = (v) => (options.find((o) => o.value === v) || options[0]).label;
  // Compact pickers (an icon button) name themselves with aria-label.
  const valueText = h('span', { class: 'picker-value' }, buttonContent ? buttonContent(current) : labelOf(current));
  const naming = ariaLabel ? { 'aria-label': `${ariaLabel}: ${labelOf(current)}` } : { 'aria-labelledby': `${labelledBy} ${buttonId}` };
  const button = h('button', {
    class: `picker-button${buttonContent ? ' is-compact' : ''}`, type: 'button', id: buttonId, 'aria-haspopup': 'listbox', 'aria-expanded': 'false',
    'aria-controls': listId, 'aria-describedby': describedBy, ...naming,
  }, valueText, !buttonContent && h('span', { class: 'picker-chevron', 'aria-hidden': 'true' }));
  const rows = options.map((option, i) => optionRow(option, `${listId}-${i}`, option.value === current));
  const panel = h('div', {
    class: 'picker-panel', role: 'listbox', id: listId, tabindex: '-1', hidden: true,
    ...(ariaLabel ? { 'aria-label': ariaLabel } : { 'aria-labelledby': labelledBy }),
  }, rows);
  const root = h('div', { class: 'picker' }, button, panel);
  const api = { root, close };

  function paintActive() {
    rows.forEach((row, i) => row.classList.toggle('is-active', i === active));
    panel.setAttribute('aria-activedescendant', rows[active].id);
  }

  function open() {
    if (PICKER.open && PICKER.open !== api) PICKER.open.close(false);
    active = Math.max(0, options.findIndex((o) => o.value === current));
    panel.hidden = false;
    button.setAttribute('aria-expanded', 'true');
    placePanel(button, panel);
    paintActive();
    panel.focus({ preventScroll: true });
    PICKER.open = api;
  }

  function close(returnFocus = true) {
    if (panel.hidden) return;
    panel.hidden = true;
    button.setAttribute('aria-expanded', 'false');
    if (PICKER.open === api) PICKER.open = null;
    if (returnFocus) button.focus();
  }

  function show(next) {
    current = next;
    fill(valueText, buttonContent ? buttonContent(current) : labelOf(current));
    if (ariaLabel) button.setAttribute('aria-label', `${ariaLabel}: ${labelOf(current)}`);
    rows.forEach((row, j) => row.setAttribute('aria-selected', String(options[j].value === current)));
  }

  function choose(i) {
    show(options[i].value);
    close(true);
    if (onChange) onChange(current);
  }

  button.addEventListener('click', () => (panel.hidden ? open() : close()));
  button.addEventListener('keydown', (event) => {
    if (['ArrowDown', 'ArrowUp', 'Enter', ' '].includes(event.key)) {
      event.preventDefault();
      open();
    }
  });
  panel.addEventListener('keydown', (event) => {
    const moves = { ArrowDown: active + 1, ArrowUp: active - 1, Home: 0, End: options.length - 1 };
    if (event.key in moves) {
      event.preventDefault();
      active = Math.min(Math.max(moves[event.key], 0), options.length - 1);
      paintActive();
    } else if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      choose(active);
    } else if (event.key === 'Escape') {
      event.preventDefault();
      event.stopPropagation();
      close(true);
    } else if (event.key === 'Tab') {
      close(false);
    } else if (event.key.length === 1 && /\S/.test(event.key)) {
      const now = Date.now();
      typed = now - typedAt > 600 ? event.key.toLowerCase() : typed + event.key.toLowerCase();
      typedAt = now;
      const found = options.findIndex((o) => o.label.toLowerCase().startsWith(typed));
      if (found >= 0) { active = found; paintActive(); }
    }
  });
  rows.forEach((row, i) => {
    row.addEventListener('click', () => choose(i));
    row.addEventListener('pointermove', () => { if (active !== i) { active = i; paintActive(); } });
  });

  return {
    el: root,
    read: () => current,
    focus: () => button.focus(),
    set: (next) => { if (options.some((o) => o.value === next) && next !== current) show(next); },
  };
}

/**
 * A text field with suggestions (combobox). Free entry is allowed; the
 * caller validates it. Down opens and moves, Enter takes the active one.
 * @param {{ options: object[], value: string, id: string, describedBy?: string }} spec
 */
function comboPicker({ options, value, id, describedBy }) {
  const listId = pickerId('combo-list');
  let active = -1;
  let shown = [];
  const input = h('input', {
    class: 'field picker-input', type: 'text', id, value: String(value ?? ''), role: 'combobox', autocomplete: 'off', spellcheck: 'false',
    'aria-autocomplete': 'list', 'aria-expanded': 'false', 'aria-controls': listId, 'aria-describedby': describedBy,
  });
  const panel = h('div', { class: 'picker-panel', role: 'listbox', id: listId, hidden: true });
  const root = h('div', { class: 'picker' }, input, panel);
  const api = { root, close: () => close() };

  function render() {
    const q = input.value.trim().toLowerCase();
    shown = options.filter((o) => !q || o.value.toLowerCase().startsWith(q) || o.label.toLowerCase().includes(q)).slice(0, 8);
    fill(panel, ...shown.map((option, i) => optionRow(option, `${listId}-${i}`, option.value === input.value.trim())));
    [...panel.children].forEach((row, i) => row.addEventListener('pointerdown', (event) => { event.preventDefault(); take(i); }));
    if (!shown.length) { close(); return; }
    active = Math.min(active, shown.length - 1);
    paintActive();
  }

  function paintActive() {
    [...panel.children].forEach((row, i) => row.classList.toggle('is-active', i === active));
    if (active >= 0 && panel.children[active]) input.setAttribute('aria-activedescendant', panel.children[active].id);
    else input.removeAttribute('aria-activedescendant');
  }

  function open() {
    if (PICKER.open && PICKER.open !== api) PICKER.open.close(false);
    render();
    if (!shown.length) return;
    panel.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    placePanel(input, panel);
    PICKER.open = api;
  }

  function close() {
    panel.hidden = true;
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
    active = -1;
    if (PICKER.open === api) PICKER.open = null;
  }

  function take(i) {
    input.value = shown[i].value;
    close();
    input.focus();
  }

  input.addEventListener('input', () => { active = -1; open(); });
  input.addEventListener('focus', () => open());
  input.addEventListener('blur', () => window.setTimeout(close, 120));
  input.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      if (panel.hidden) open();
      active = Math.min(Math.max(active + (event.key === 'ArrowDown' ? 1 : -1), 0), shown.length - 1);
      paintActive();
    } else if (event.key === 'Enter' && !panel.hidden && active >= 0) {
      event.preventDefault();
      take(active);
    } else if (event.key === 'Escape' && !panel.hidden) {
      event.preventDefault();
      event.stopPropagation();
      close();
    }
  });

  return { el: root, read: () => input.value.trim(), focus: () => input.focus() };
}

      opt('de', 'de', 'German'), opt('it', 'it', 'Italian'), opt('pt-BR', 'pt-BR', 'Portuguese (Brazil)'), opt('pt-PT', 'pt-PT', 'Portuguese (Portugal)'),
      opt('nl', 'nl', 'Dutch'), opt('sv', 'sv', 'Swedish'), opt('pl', 'pl', 'Polish'), opt('tr', 'tr', 'Turkish'),
      opt('ru', 'ru', 'Russian'), opt('uk', 'uk', 'Ukrainian'), opt('ja', 'ja', 'Japanese'), opt('ko', 'ko', 'Korean'),

      opt('id', 'id', 'Indonesian'), opt('vi', 'vi', 'Vietnamese'), opt('fil', 'fil', 'Filipino'), opt('ar', 'ar', 'Arabic'), opt('he', 'he', 'Hebrew'),
    ] },
  visuals: { label: 'Preferred visuals', kind: 'multi', options: ['layers', 'cycle', 'state', 'compare', 'hierarchy', 'beforeAfter', 'quadrant', 'funnel', 'venn'], help: 'Picked first when a chapter can use a picture.' },
  quiz: { label: 'Quiz', kind: 'onoff', help: 'End explainers with a few questions.' },
  analogies: { label: 'Analogies', kind: 'onoff', help: 'Add a "think of it like" line to key ideas.' },
  model: { label: 'Model for estimates', kind: 'list', help: 'Used to price a run before it starts.',
    options: [opt('auto', 'Auto', 'Let the estimate pick'), opt('fable-5.2', 'Fable 5.2'), opt('opus-5.5', 'Opus 5.5'), opt('sonnet-5.5', 'Sonnet 5.5'), opt('haiku-5.5', 'Haiku 5.5')] },
  budgetUsd: { label: 'Budget in US dollars', kind: 'number', help: 'Start without asking when the estimate fits. Leave empty to always ask.' },
  confirmBeforeStart: { label: 'Confirm before starting', kind: 'onoff', help: 'Show the estimate and wait for a yes.' },
  instructions: { label: 'House instructions', kind: 'textarea', help: 'Plain text added to every run: house style, terms to use. Never overrides the truth rules.' },
};
const optionValues = (field) => field.options.map((o) => (typeof o === 'string' ? o : o.value));
const CONFIG_FIELD_DEFAULTS = {
  style: 'clean', defaultType: 'auto', audience: 'engineer', depth: 'standard', language: 'en', visuals: [], chapters: {},
  quiz: true, analogies: true, model: 'auto', budgetUsd: null, confirmBeforeStart: true, instructions: '',
};
const INSTRUCTIONS_LIMIT = 2000;
const CLI_NAME = 'concept-explainer';

function readingValue(pref) {
  const value = readStore(pref.storeKey);
  return pref.choices.some((c) => c.choice === value) ? value : pref.fallback;
}

// data-motion, data-text, data-density on <html>; defaults leave them off.
function applyReading() {
  const root = document.documentElement;
  READING_PREFS.forEach((pref) => {
    const value = readingValue(pref);
    if (value === pref.fallback) delete root.dataset[pref.key];
    else root.dataset[pref.key] = value;
  });
}

function readingSwitch(registry, pref) {
  return choiceSwitch(registry, {
    choices: pref.choices, read: () => readingValue(pref), label: pref.label, className: 'theme-switch style-switch', withIcons: false,
    write: (choice) => { writeStore(pref.storeKey, choice); applyReading(); },
  });
}

// `library serve` opens pages with #token=<t>. Keep it for this tab only and
// clear it from the address before the router reads the hash.
const SERVE_TOKEN_KEY = 'concept-explainer:serve-token';

function withServe(context) {
  const served = /^https?:$/.test(window.location.protocol);
  const match = window.location.hash.match(/^#token=([A-Za-z0-9_-]{8,256})$/);
  let token = null;
  if (match) {
    token = match[1];
    try {
      window.sessionStorage.setItem(SERVE_TOKEN_KEY, token);
    } catch (error) {
      // Without session storage the token still works until reload.
    }
    try {
      window.history.replaceState(window.history.state, '', `${window.location.pathname}${window.location.search}`);
    } catch (error) {
      window.location.hash = '';
    }
  } else if (served) {
    try {
      token = window.sessionStorage.getItem(SERVE_TOKEN_KEY);
    } catch (error) {
      token = null;
    }
  }
  if (!served || !token) return context;
  return { ...context, serve: { ...(context.serve || {}), token } };
}

// ---------- Quick theme: a small menu by the gear, and Shift+D ----------
const THEME_ICON_OPTIONS = THEME_CHOICES.map((t) => ({ value: t.choice, label: t.label }));

function setTheme(registry, choice) {
  writeStore(THEME_KEY, choice);
  applyTheme(choice);
  registry.paint();
  registry.changed();
}

// The theme menu, kept in sync with every other theme control on the page.
function quickTheme(registry) {
  const picker = listboxPicker({
    options: THEME_ICON_OPTIONS, value: storedTheme(), ariaLabel: 'Theme',
    buttonContent: (value) => icon(value), onChange: (choice) => setTheme(registry, choice),
  });
  registry.onChange(() => picker.set(storedTheme()));
  return h('div', { class: 'quick-theme' }, picker.el);
}

// Shift+D cycles light, dark, system. Ignored while typing.
function installThemeShortcut(registry) {
  const live = h('div', { class: 'sr-only', role: 'status', 'aria-live': 'polite' });
  document.body.append(live);
  const order = ['light', 'dark', 'system'];
  document.addEventListener('keydown', (event) => {
    if (event.key !== 'D' || !event.shiftKey || event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.target.closest && event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
    event.preventDefault();
    const next = order[(order.indexOf(storedTheme()) + 1) % order.length];
    setTheme(registry, next);
    live.textContent = `${THEME_CHOICES.find((t) => t.choice === next).label} theme`;
  });
}
