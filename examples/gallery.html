<style>
/* ---- base.css ---- */
/* Concept Explainer: a dashboard in the Geist system. See references/design-system.md.
   Greys from Geist, one orange accent, 6px radius, hairline rings, no blurred shadows, no gradients.
   Orange means "where you are, what is done, the primary action". It never fills a large area. */
:root {
  color-scheme: light; --canvas: #fafafa; --surface: #ffffff; --line: #ebebeb; --ink: #171717; --body: #4d4d4d;
  --muted: #666666; --quiet: #8f8f8f; --faint: #c9c9c9; --accent: #fc5e32; --accent-fill: #d2430e;
  --accent-hover: #b83a0b; --accent-text: #c2410c; --good: #297a3a; --bad: #cb2a2f; --on-accent: #ffffff;
  --ring: 0 0 0 1px var(--line); --ring-strong: 0 0 0 1px var(--faint); --ring-ink: 0 0 0 1px var(--ink);
  --ring-accent: 0 0 0 1.5px var(--accent); --hover-tint: rgb(0 0 0 / 0.04);
  --bar-glass: rgb(250 250 250 / 0.82); --radius: 6px;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --tracking-label: 0.071em;
  --gutter: clamp(16px, 4vw, 48px); --content-max: 1160px; --view-top: clamp(28px, 4vw, 48px);
  --title-gap: 32px; --card-pad: 24px; --grid-gap: 16px; --sticky-top: 80px; --heads-top: 68px;
  --ease: cubic-bezier(0.2, 0, 0, 1);
  /* Skin tokens: the Playful style redefines these (end of file). */
  --heading: var(--ink); --display: var(--ink); --link: var(--ink); --select: var(--accent);
  --select-wash: var(--surface); --nav-current-bg: var(--canvas); --nav-current-ring: inset 0 0 0 1px var(--line);
  --primary-ring: 0 0 0 0 transparent; --good-wash: var(--surface); --bad-wash: var(--surface); --hair: 1px;
  --radius-sm: 4px; --body-weight: 400; --body-tracking: 0; --heading-weight: 450; --code-bg: var(--canvas);
  --code-ring: inset 0 0 0 var(--hair) var(--line); --code-ink: var(--body); --code-kw: var(--ink);
  --code-cm: var(--quiet); --code-st: var(--accent-text); --mark-bg: rgb(252 94 50 / 0.16); --hint-bg: var(--surface); --hint-ring: var(--line); --hint-ink: var(--muted);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --canvas: #111111; --surface: #1a1a1a; --line: #2c2c2c; --ink: #ededed; --body: #c4c4c4;
    --muted: #a3a3a3; --quiet: #8c8c8c; --faint: #4d4d4d; --accent: #ff7043; --accent-fill: #c8410e;
    --accent-hover: #e0521c; --accent-text: #ff8a5c; --good: #62c073; --bad: #ff6166;
    --ring-strong: 0 0 0 1px #5a5a5a; --hover-tint: rgb(255 255 255 / 0.06); --bar-glass: rgb(17 17 17 / 0.82);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --canvas: #111111; --surface: #1a1a1a; --line: #2c2c2c; --ink: #ededed; --body: #c4c4c4;
  --muted: #a3a3a3; --quiet: #8c8c8c; --faint: #4d4d4d; --accent: #ff7043; --accent-fill: #c8410e;
  --accent-hover: #e0521c; --accent-text: #ff8a5c; --good: #62c073; --bad: #ff6166;
  --ring-strong: 0 0 0 1px #5a5a5a; --hover-tint: rgb(255 255 255 / 0.06); --bar-glass: rgb(17 17 17 / 0.82);
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--canvas); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  font-weight: var(--body-weight);
  letter-spacing: var(--body-tracking);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  /* Long identifiers, paths and URLs wrap instead of stretching their box. */
  overflow-wrap: break-word;
}
h1, h2, h3, h4, p, ol, ul, dl, dd, figure { margin: 0; }
ol, ul { padding: 0; list-style: none; }
h1, h2, h3, h4 { font-weight: var(--heading-weight); color: var(--heading); text-wrap: balance; overflow-wrap: anywhere; hyphens: auto; }
p { text-wrap: pretty; }
b, strong { font-weight: 550; color: var(--ink); }
a { color: var(--link); text-decoration-thickness: from-font; text-underline-offset: 0.2em; }
@media (hover: hover) { a:hover { text-decoration-color: var(--accent); } }
code, pre, kbd, .mono { font-family: var(--mono); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
:focus:not(:focus-visible) { outline: none; }
[tabindex="-1"]:focus { outline: none; }
::selection { background: rgb(252 94 50 / 0.2); }
.skip {
  position: absolute; inset-block-start: 8px; inset-inline-start: 8px; z-index: 40; padding: 12px 16px;
  border-radius: var(--radius); background: var(--surface); color: var(--ink); box-shadow: var(--ring-strong); transform: translateY(-200%);
}
.skip:focus { transform: none; }
.noscript, .fatal { max-width: 640px; margin: 64px auto; padding: 24px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--ring); color: var(--body); }
.fatal h1 { margin-bottom: 8px; font-size: 20px; }

/* Labels: mono, uppercase, wide tracking */
.eyebrow, .panel-bar, .side-label, .step-count, .tag, .top-row, .glance-grid dt {
  font-family: var(--mono); font-size: 12px; font-weight: 400; line-height: 1.5; letter-spacing: var(--tracking-label); text-transform: uppercase;
}
.eyebrow { color: var(--ink); overflow-wrap: anywhere; }
.eyebrow.quiet { color: var(--muted); }
.tag {
  display: inline-block; max-width: 100%; padding: 0 6px; border-radius: var(--radius-sm); vertical-align: middle;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  background: var(--surface); box-shadow: inset 0 0 0 var(--hair) var(--line); font-size: 11px; line-height: 18px; color: var(--body);
}
.tag-new::before, .tag-key::before, .tag-agent::before, .tag-human::before {
  content: ""; display: inline-block; width: 6px; height: 6px; margin-inline-end: 6px; vertical-align: 1px; border-radius: 1px; background: var(--accent);
}
.tag-agent::before, .tag-human::before { border-radius: 9999px; background: none; box-shadow: inset 0 0 0 var(--hair) var(--muted); }
.tag-agent::before { background: var(--muted); }
.stack .tag, .lib-stack .tag { max-width: min(100%, 32ch); }
.chip {
  display: inline-block; max-width: 100%; min-height: 28px; padding: 2px 10px; border-radius: var(--radius); line-height: 24px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle;
  background: var(--surface); box-shadow: var(--ring); font-size: 14px; color: var(--ink); text-decoration: none;
}
@media (hover: hover) { a.chip:hover { box-shadow: var(--ring-strong); } }
.chip-file {
  display: inline-block; max-width: 100%; padding: 2px 8px; border-radius: var(--radius-sm); background: var(--canvas); box-shadow: inset 0 0 0 var(--hair) var(--line);
  font-family: var(--mono); font-size: 12.5px; line-height: 20px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle;
}
.link { padding: 0; border: 0; background: none; color: var(--link); text-align: start; text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
@media (hover: hover) { .link:hover { text-decoration-color: var(--accent); } }
.empty { padding: 24px; border-radius: var(--radius); box-shadow: inset 0 0 0 var(--hair) var(--line); color: var(--muted); text-align: center; }

/* ---------- Buttons: primary (orange), secondary (hairline), text links ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border: 0; border-radius: var(--radius); background: var(--surface); color: var(--ink); box-shadow: var(--ring);
  font: inherit; font-size: 15px; font-weight: 500; line-height: 1.2; text-decoration: none; white-space: nowrap;
  transition-property: background-color, box-shadow, color, scale; transition-duration: 150ms; transition-timing-function: var(--ease);
}
.btn.primary { background: var(--accent-fill); color: var(--on-accent); box-shadow: var(--primary-ring); font-weight: 550; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn:disabled { background: var(--surface); color: var(--faint); box-shadow: var(--ring); cursor: default; }
@media (hover: hover) {
  .btn:not(:disabled):hover { box-shadow: var(--ring-strong); }
  .btn.primary:not(:disabled):hover { background: var(--accent-hover); box-shadow: var(--primary-ring); }
}
.btn:not(:disabled):active { scale: 0.97; }
.btn[data-state="done"] { box-shadow: var(--ring-ink); }
.btn-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

/* ---------- Panels ---------- */
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--ring); }
.panel-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px;
  box-shadow: inset 0 -1px 0 var(--line); color: var(--muted);
}
.panel-bar h2 { font: inherit; color: inherit; }
.panel-bar a { color: var(--ink); text-transform: none; letter-spacing: 0; font-family: var(--sans); font-size: 14px; }
.why { display: grid; gap: 2px; padding: 2px 0 2px 14px; box-shadow: inset 2px 0 0 var(--line); color: var(--body); }
.why .eyebrow { font-size: 11px; }
.why-risk { box-shadow: inset 2px 0 0 var(--faint); }


/* ---------- Motion (Web Animations run from dom.js; these are CSS-only touches) ---------- */
@media (prefers-reduced-motion: no-preference) {
  .view:not([hidden]) .view-head, .view:not([hidden]) .ov-head { animation: rise-in 280ms var(--ease) both; }
}
@keyframes rise-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Long words ----------
   Flex and grid items refuse to shrink below their longest word, so text
   holders in rows must opt in to breaking anywhere and to a 100% cap. */
.link, .option, .change-top > *, .step-top > *, .step-route > *, .route-part,
.rel li > *, .er-name > *, .entity-name, .entity-key > *, .node-label, .glossary dt, .glossary dd, .key-badge + *,
.flow-pick-title, .card-title, .row-title, .flow-trigger > span, .tree .note, .change-top, .side-repo b, .pager-title, .map-col-head, .next-title {
  max-width: 100%;
  overflow-wrap: anywhere;
  min-width: 0;
}
.chip-file { overflow-wrap: normal; }
.er-detail-head h3, .code-head > *, .entity-head > *, .step-route, .view-head h1, .ov-head h1 { min-width: 0; overflow-wrap: anywhere; }


/* Single-column grids get an explicit shrinkable track: an implicit "auto" track grows to its longest path. */
.view-body, .map-shell, .flow-player, .timeline, .change-card, .quiz, .question, .glossary-wrap, .runbook, .run-item,
.detail-main, .detail-side, .er-detail-head, .er-rels, .kit-stack, .ov-head, .why, .feedback, .step-code, .flow-meta, .rel, .files, .options { grid-template-columns: minmax(0, 1fr); }

/* ---------- Long names: the "?" hint and its tooltip (truncatable in dom.js) ---------- */
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.truncatable.is-truncated { position: relative; padding-inline-end: 22px; }
.trunc-hint {
  position: absolute; inset-inline-end: 2px; inset-block-end: max(1px, calc((1lh - 16px) / 2));
  display: inline-grid; place-items: center; width: 16px; height: 16px; padding: 0; border: 0; border-radius: 9999px;
  background: var(--hint-bg); box-shadow: inset 0 0 0 var(--hair) var(--hint-ring); color: var(--hint-ink);
  font: 500 10px/1 var(--mono); letter-spacing: 0; text-transform: none; cursor: help;
}
.trunc-hint::before { content: ""; position: absolute; inset: -4px; }
@media (hover: hover) { .trunc-hint:hover { color: var(--ink); box-shadow: inset 0 0 0 var(--hair) var(--faint); } }
button.trunc-hint:focus-visible { outline-offset: 1px; }
.trunc-tip {
  position: fixed; inset: auto; margin: 0; z-index: 60; max-width: min(420px, 90vw); padding: 4px 8px; border: 0; border-radius: var(--radius-sm);
  background: var(--ink); color: var(--canvas); font: 500 12.5px/1.45 var(--sans); letter-spacing: 0; text-transform: none;
  overflow-wrap: anywhere; white-space: normal; pointer-events: none;
}
@media (prefers-reduced-motion: no-preference) { .trunc-tip:not([hidden]) { animation: fade-in 120ms var(--ease); } }
.chip-text { display: block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* A shortened long token: the short form (not copied), the full token for
   screen readers and copy, and an inline hint at text size. */
.token-visible { user-select: none; -webkit-user-select: none; }
.token-short .trunc-hint {
  position: relative; inset: auto; display: inline-grid; width: min(16px, 1.1em); height: min(16px, 1.1em);
  margin-inline: 0.2em 0.05em; vertical-align: -0.15em; font-size: max(9px, 0.62em); line-height: 1;
}
.token-short .trunc-hint::before { inset: -4px 0; }
.truncatable.is-truncated > .token-short .trunc-hint { display: none; }
/* Single-line holders keep a shortened token on one line; their own ellipsis does the rest. */
:is(.facet-text, .tag, .chip-text, .nav-label, .node-tech, .map-col-name, .result-group-title, .side-stamp, .name) .token-short,
:is(.facet-text, .tag, .chip-text, .nav-label, .node-tech, .map-col-name, .result-group-title, .side-stamp, .name) .token-visible { white-space: nowrap; }
/* There the hint sits in space reserved at the end of the token, so it can never wrap to its own line. */
:is(.facet-text, .tag, .chip-text, .nav-label, .node-tech, .map-col-name, .result-group-title, .side-stamp, .name) .token-short { position: relative; padding-inline-end: calc(min(16px, 1.1em) + 0.3em); }
:is(.facet-text, .tag, .chip-text, .nav-label, .node-tech, .map-col-name, .result-group-title, .side-stamp, .name) .token-short .trunc-hint {
  position: absolute; inset-inline-end: 0; inset-block-start: 50%; margin: 0; translate: 0 -50%;
}
/* Chrome still breaks at <wbr> under nowrap; single-line holders drop the break points. */
:is(.facet-text, .tag, .chip-text, .nav-label, .node-tech, .map-col-name, .result-group-title, .side-stamp, .name) wbr { display: none; }
/* Narrow boxes hyphenate a long word instead of breaking off its last letter. */
.node-label, .entity-name, .flow-pick-title, .card-title, .next-title { hyphens: auto; -webkit-hyphens: auto; }

/* ---- shell.css ---- */
/* Shell: sidebar, phone bar and Menu sheet, theme and style switches. */

/* ---------- Shell: sidebar on wide screens, a top bar and Menu sheet below 1024px ---------- */
.app { min-height: 100vh; min-height: 100dvh; }
.main-col { display: block; min-width: 0; }
.main-col:focus { outline: none; }
.wrap { max-width: var(--content-max); margin-inline: auto; padding-inline: var(--gutter); }
.side { display: none; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; min-height: 44px; color: var(--ink); text-decoration: none; }
.brand-mark { flex: none; width: 18px; height: 18px; }
.brand-mark-tile { fill: var(--accent); }
.name { font-family: var(--mono); font-size: 14px; letter-spacing: 0.02em; color: var(--ink); }
@media (min-width: 1024px) {
  .app { display: grid; grid-template-columns: 256px minmax(0, 1fr); }
  .top { display: none; }
  /* A fixed-height column: only the nav list scrolls, so the footer (theme and Settings) is always in view. */
  .side {
    position: sticky; inset-block-start: 0; align-self: start; height: 100vh; height: 100dvh; overflow: hidden;
    display: flex; flex-direction: column; gap: 16px; padding: 20px 12px 12px 16px;
    background: var(--surface); box-shadow: inset -1px 0 0 var(--line);
  }
  /* Room on every side so rings and focus outlines are never clipped by the scroll edge. */
  .side > .links { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin: -6px -6px -8px; padding: 6px 6px 8px; }
  .side > .brand, .side > .side-repo, .side > .side-foot { flex: none; }
  .side .brand { padding-inline: 8px; }
  :root { --sticky-top: 24px; --heads-top: 0px; }
}
.side-repo { display: grid; gap: 2px; padding: 0 8px; }
.side-repo b { font-size: 15px; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.side-repo .mono { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.links ul { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.links ul + .side-label { margin-block-start: 16px; }
.side-label { padding: 0 8px 6px 20px; color: var(--muted); }
.links a {
  position: relative; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  min-height: 40px; padding: 0 10px 0 20px; border-radius: var(--radius);
  font-size: 15px; line-height: 1.3; color: var(--body); text-decoration: none;
}
.links a::before {
  content: ""; position: absolute; inset-inline-start: 8px; inset-block-start: 50%; width: 6px; height: 6px; margin-block-start: -3px;
  border-radius: 1px; background: transparent;
}
.links a[aria-current="page"] { background: var(--nav-current-bg); color: var(--heading); font-weight: 500; box-shadow: var(--nav-current-ring); }
.links a[aria-current="page"]::before { background: var(--select); }
@media (hover: hover) { .links a:not([aria-current="page"]):hover { background: var(--hover-tint); color: var(--ink); } }
.nav-label { min-width: 0; }
.nav-count { flex: none; font-family: var(--mono); font-size: 12px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.is-viewed .nav-count::before { content: "\2713\00a0"; color: var(--accent); }
.side-foot, .sheet-foot { margin-block-start: auto; display: grid; gap: 8px; padding-block-start: 14px; box-shadow: inset 0 1px 0 var(--line); }
.side-progress { padding: 2px 8px 2px 20px; font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.side-util .util {
  display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px 0 20px; border-radius: var(--radius);
  font-size: 15px; color: var(--body); text-decoration: none;
}
.util-ic { display: inline-flex; color: var(--quiet); }
.util-ic svg { width: 16px; height: 16px; }
@media (hover: hover) { .side-util .util:hover { background: var(--hover-tint); color: var(--ink); } }
.side-theme { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 8px 2px 20px; }
.side-theme-label { font-size: 14px; color: var(--muted); }
.side-stamp { padding: 0 8px 0 20px; font-family: var(--mono); font-size: 11px; color: var(--quiet); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* The theme switch: three icon buttons in a pill */

}

/* Top bar (below 1024px): floats over the page, then a full-screen Menu sheet */
.top { position: sticky; inset-block-start: 0; z-index: 10; padding: max(12px, env(safe-area-inset-top)) var(--gutter) 0; pointer-events: none; }

.bar-view { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 500; color: var(--ink); }

.menu-icon::after { content: ""; position: absolute; inset-inline: 0; inset-block-start: 4.25px; height: 1.5px; background: currentColor; }
@media (max-width: 639px) {

  .top { padding: 0; }
  .bar { border-radius: 0; box-shadow: 0 1px 0 0 var(--line); padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 6px max(16px, env(safe-area-inset-left)); }

}
.sheet {
  margin: 0; inset: 0; width: 100vw; max-width: none; height: 100vh; height: 100dvh; max-height: none; border: 0;
  padding: 0 max(8px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));

}

.sheet-head {
  position: sticky; inset-block-start: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  min-height: 56px; margin-inline: calc(-1 * max(12px, env(safe-area-inset-left))) calc(-1 * max(8px, env(safe-area-inset-right)));
  padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 6px max(16px, env(safe-area-inset-left));
  background: var(--surface); box-shadow: 0 1px 0 0 var(--line);
}
.sheet-head .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--sans); font-size: 17px; font-weight: 500; letter-spacing: -0.01em; }
.close-icon { position: relative; width: 14px; height: 14px; }
.close-icon::before, .close-icon::after { content: ""; position: absolute; inset-inline: -2px; inset-block-start: 6.25px; height: 1.5px; background: currentColor; rotate: 45deg; }
.close-icon::after { rotate: -45deg; }

  .sheet[open]::backdrop { animation: fade-in 180ms var(--ease); }
}

/* ---------- Style switch and icon sets ---------- */
.style-switch .ts-option { width: auto; padding: 0 10px; font-size: 13px; font-weight: 500; }
.ico-playful { display: none; }
:root[data-style="playful"] .ico-playful { display: inline; }

/* ---------- Pickers (picker.js): option cards, segmented rows, listbox, combobox ---------- */
.pick-group { display: inline-flex; flex-wrap: wrap; gap: 2px; max-width: 100%; }
.pick-group.is-segmented { padding: 3px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--ring); }
.pick-group.is-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 8px; width: 100%; }
.pick-option { position: relative; min-height: 32px; padding: 0 12px; border: 0; border-radius: var(--radius-sm); background: none; font-size: 14px; color: var(--muted); text-align: start; }
.pick-group.is-segmented .pick-option[aria-checked="true"] { background: var(--canvas); color: var(--ink); font-weight: 500; box-shadow: var(--ring); }
.pick-option.is-card { display: grid; gap: 4px; align-content: start; min-height: 72px; padding: 12px 14px 12px 30px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--ring); color: var(--ink); }

.style-preview { display: flex; gap: 4px; align-items: flex-end; height: 34px; margin-block-end: 6px; padding: 6px; border-radius: 4px; }

.picker { position: relative; display: inline-block; max-width: 100%; }
.picker-button {
  display: inline-flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; min-width: min(100%, 16em); max-width: 100%; padding: 0 12px;
  border: 0; border-radius: var(--radius); background: var(--surface); box-shadow: var(--ring); font: inherit; font-size: 15px; color: var(--ink); text-align: start;
}
.picker-value { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.picker-button[aria-expanded="true"] { box-shadow: var(--ring-strong); }

.picker-button.is-compact svg { width: 16px; height: 16px; }
@media (hover: hover) { .picker-button:hover { box-shadow: var(--ring-strong); } .picker-button.is-compact:hover { color: var(--ink); } }
.picker-panel {
  position: absolute; inset-block-start: calc(100% + 6px); inset-inline-start: 0; z-index: 30; display: grid; gap: 2px; min-width: max(100%, 15em); max-width: min(26em, calc(100vw - 32px));
  padding: 4px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--ring-strong);
}

.picker-panel.is-end { inset-inline-start: auto; inset-inline-end: 0; }
.picker-panel:focus { outline: none; }
.picker-option { display: grid; grid-template-columns: 16px minmax(0, 1fr); align-items: start; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; }
.picker-option.is-active { background: var(--hover-tint); box-shadow: inset 0 0 0 var(--hair) var(--line); }
.picker-panel:focus .picker-option.is-active, .picker-input:focus ~ .picker-panel .picker-option.is-active { box-shadow: inset 0 0 0 1.5px var(--ink); }
.picker-check { width: 16px; height: 16px; margin-block-start: 2px; }
.picker-option[aria-selected="true"] .picker-check::before { content: "\2713"; display: block; font-size: 13px; line-height: 16px; text-align: center; color: var(--accent-text); }
.picker-text { display: grid; gap: 1px; min-width: 0; }
.picker-label { font-size: 15px; color: var(--ink); overflow-wrap: anywhere; }
.picker-desc { font-size: 13px; line-height: 1.4; color: var(--muted); }

@media (max-width: 639px) {
  /* On phones the list opens as a bottom sheet, full width and within reach. */
  .picker > .picker-panel, .picker > .picker-panel.is-up, .picker > .picker-panel.is-end, .side .quick-theme .picker-panel, .bar .quick-theme .picker-panel {
    position: fixed; inset: auto 0 0 0; max-width: none; min-width: 0; padding: 8px 8px max(12px, env(safe-area-inset-bottom));
    border-radius: var(--radius) var(--radius) 0 0; z-index: 70; box-shadow: var(--ring-strong), 0 0 0 100vmax rgb(0 0 0 / 0.4);
  }

}

.bar .quick-theme .picker-panel { inset-inline-start: auto; inset-inline-end: 0; }

/* ---- views.css ---- */
/* Views: title blocks, the Overview dashboard, code blocks, display-title sizing. */

/* ---------- Views: one at a time, each with the same title block ---------- */
.view { padding-block: var(--view-top) 0; }
.view-head { display: grid; gap: 10px; margin-block-end: var(--title-gap); max-width: 46em; }

.pager { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--grid-gap); margin-block-start: 56px; }
.pager-link {
  display: grid; gap: 2px; padding: 16px 20px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--ring);
  text-decoration: none; transition: box-shadow 150ms var(--ease);

/* ---------- Overview ---------- */
.overview { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--grid-gap); align-items: start; }

.stack { display: flex; flex-wrap: wrap; gap: 6px; margin-block-start: 6px; }
.ov-next { grid-column: 1 / 9; align-self: stretch; display: grid; }
.ov-progress { grid-column: 9 / -1; align-self: stretch; display: grid; }
@media (max-width: 899px) { .ov-next, .ov-progress { grid-column: 1 / -1; } }
.next-up { display: flex; flex-direction: column; gap: 6px; padding: var(--card-pad); box-shadow: var(--ring-accent); }

.meter { height: 4px; border-radius: 9999px; background: var(--line); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); transform-origin: 0 50%; transform: scaleX(var(--share, 0)); transition: transform 300ms var(--ease); }
.prog-break { display: grid; gap: 4px; margin-block-start: 4px; }

.glance-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.glance-grid > div { display: grid; gap: 6px; padding: 16px var(--card-pad) 18px; min-width: 0; }
.glance-grid > div + div { box-shadow: inset 1px 0 0 var(--line); }

@media (max-width: 759px) {
  .glance-grid, .changes-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .glance-grid > div:nth-child(odd) { box-shadow: none; }

}
.ov-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-block: 32px 16px; }

.cards { display: grid; gap: var(--grid-gap); grid-auto-rows: minmax(0, auto); }
.cards > li { display: flex; min-width: 0; }
@media (min-width: 640px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1200px) { .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card {
  position: relative; display: flex; flex: 1 1 auto; flex-direction: column; gap: 10px; min-width: 0; min-height: 200px; padding: var(--card-pad);
  border-radius: var(--radius); background: var(--surface); box-shadow: var(--ring); color: var(--ink); text-decoration: none;

}

.card-viewed { visibility: hidden; color: var(--ink); }
.card-viewed::before { content: "\2713\00a0"; color: var(--accent); }

@media (hover: hover) {
  .card:hover { box-shadow: 0 0 0 1px var(--quiet); translate: 0 -2px; }

}
.ov-changes { margin-block-start: 16px; }
.rows li + li { box-shadow: inset 0 1px 0 var(--line); }
.row-link { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) auto; align-items: baseline; gap: 4px 16px; padding: 14px 16px; color: var(--ink); text-decoration: none; }

@media (max-width: 559px) { .row-link { grid-template-columns: minmax(0, 1fr) auto; } .row-title { grid-column: 1 / -1; grid-row: 2; } }

/* ---------- Settings ---------- */
.settings-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--grid-gap); max-width: 880px; }

.field:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.toggle { width: 20px; height: 20px; margin: 0; accent-color: var(--accent-fill); }
.multi { display: flex; flex-wrap: wrap; gap: 6px; }

.multi-option:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
.settings-form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
.settings-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding-block-start: 16px; box-shadow: inset 0 1px 0 var(--line); margin-block-start: 8px; }
.settings-status { font-size: 14px; color: var(--body); }
.settings-commands:empty { display: none; }
.settings-commands { display: grid; gap: 8px; padding-block-start: 12px; }
.command-list { display: grid; gap: 6px; }
.command-list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.command-list code { padding: 8px 10px; border-radius: var(--radius-sm); background: var(--code-bg); box-shadow: var(--code-ring); color: var(--code-ink); font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
@media (max-width: 639px) {
  .setting-row { grid-template-columns: minmax(0, 1fr); }
  .setting-row .setting-hint, .setting-row .field-error, .setting-count { grid-column: 1; }
}

/* Reading choices from Settings (data-* on <html>, set before first paint). */
:root[data-motion="reduce"] *, :root[data-motion="reduce"] *::before, :root[data-motion="reduce"] *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
:root[data-text="large"] body { zoom: 1.125; }
:root[data-density="compact"] { --card-pad: 16px; --grid-gap: 10px; --view-top: 20px; --title-gap: 20px; }
:root[data-density="compact"] .links a { min-height: 34px; }
:root[data-density="compact"] .btn { min-height: 38px; }
:root[data-density="compact"] .option { min-height: 40px; padding-block: 6px; }
:root[data-density="compact"] .node { padding-block: 6px; }
.share-row > :not(.setting-label) { grid-column: 2; }
.share-row .settings-status:empty, .share-row .settings-commands:empty { display: none; }
@media (max-width: 639px) { .share-row > :not(.setting-label) { grid-column: 1; } }

/* ---- diagrams.css ---- */
/* Diagrams: architecture map, flows, changes timeline, tree, data model. */

/* ---------- Architecture map ---------- */
.map-shell { display: grid; gap: var(--grid-gap); }
.map-panel { padding: 20px; }
.map-scroll { overflow-x: auto; overflow-y: hidden; }
.map-canvas { position: relative; padding: 4px; }
.map-edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.map-grid { position: relative; display: grid; grid-template-columns: repeat(var(--fit-cols, var(--cols)), minmax(0, 1fr)); gap: 40px; }
.map-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.map-col-head { display: flex; align-items: flex-start; gap: 8px; font-family: var(--mono); font-size: 12px; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--muted); }
.map-col, .layer-dot, .kit-layer { --layer: var(--layer-clean); }
.map-col-head::before { content: ""; flex: none; width: 8px; height: 8px; margin-block-start: 5px; border-radius: 2px; background: var(--layer); }
.node {
  position: relative; display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 0; text-align: start;
  border-radius: var(--radius); background: var(--surface); color: var(--ink);
  box-shadow: var(--ring), inset 2px 0 0 var(--layer);
  transition: opacity 160ms var(--ease), box-shadow 160ms var(--ease);
}
.node-icon { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--radius); box-shadow: inset 0 0 0 var(--hair) var(--line); color: var(--muted); }
.node-icon svg { width: 18px; height: 18px; }
.node-text { min-width: 0; }
.node-label { display: block; font-size: 14px; font-weight: 500; line-height: 1.25; }
.node-tech { display: block; font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node-badge { position: absolute; inset-block-start: -9px; inset-inline-end: 8px; }
@media (hover: hover) { .node:hover { box-shadow: var(--ring-strong), inset 2px 0 0 var(--layer); } }
.map-canvas.has-selection .node, .map-canvas.is-changes .node { opacity: 0.4; }
.map-canvas.has-selection .node.is-related { opacity: 1; }
.map-canvas.has-selection .node.is-selected { opacity: 1; box-shadow: var(--ring-accent), inset 2px 0 0 var(--layer); }
.map-canvas.has-selection .node.is-selected .node-icon { color: var(--accent-text); }
.map-canvas.is-changes .node.is-changed { opacity: 1; box-shadow: var(--ring-accent), inset 2px 0 0 var(--layer); }
.edge { fill: none; stroke: var(--faint); stroke-width: 1.25; transition: stroke 160ms ease, opacity 160ms ease; }
.edge.is-async { stroke-dasharray: 5 5; }
.marker-head { fill: var(--faint); }
.marker-head.is-active, .marker-head.is-current { fill: var(--accent); }
.marker-head.is-done { fill: var(--muted); }
.map-canvas.has-selection .edge { opacity: 0.3; }
.map-canvas.has-selection .edge.is-active { opacity: 1; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 6 5; animation: edge-flow 1.1s linear infinite; }
@keyframes edge-flow { to { stroke-dashoffset: -22; } }
.edge-label { font-family: var(--mono); font-size: 10.5px; fill: var(--body); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; opacity: 0; }
.map-canvas.has-selection .edge-label.is-active { opacity: 1; }
.map-detail { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px 40px; align-items: start; padding: var(--card-pad); }
.detail-main, .detail-side { display: grid; gap: 10px; min-width: 0; align-content: start; }
.map-detail h3 { font-size: 22px; line-height: 1.2; letter-spacing: -0.03em; }
.map-detail p { color: var(--body); }
.detail-icon { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: var(--radius); box-shadow: inset 0 0 0 var(--hair) var(--line); color: var(--muted); }
.detail-icon svg { width: 16px; height: 16px; }
.detail-tech { font-family: var(--mono); font-size: 13px; }
.detail-label { margin-block-start: 6px; font-family: var(--mono); font-size: 12px; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--muted); }
.files { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.rel { display: grid; gap: 8px; }
.rel li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; }
.arrow-glyph { font-family: var(--mono); color: var(--muted); }
.map-legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-family: var(--mono); font-size: 12px; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--muted); }
.map-legend span { display: inline-flex; align-items: center; gap: 8px; }
.map-legend i { display: inline-block; width: 24px; border-block-start: 1.5px solid var(--faint); }
.map-legend i.dash { border-block-start-style: dashed; }

/* ---------- Flows ---------- */
.flow-player { display: grid; gap: var(--grid-gap); }
.flow-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 8px; }
.flow-pick {
  display: grid; gap: 4px; width: 100%; height: 100%; padding: 12px 14px; border: 0; border-radius: var(--radius);
  background: var(--surface); box-shadow: var(--ring); text-align: start; transition: box-shadow 150ms var(--ease);
}
.flow-pick-top { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.flow-pick-title { font-size: 15px; font-weight: 500; line-height: 1.3; color: var(--ink); }
.flow-pick[aria-pressed="true"] { box-shadow: var(--ring-accent); }
.flow-pick[aria-pressed="true"] .flow-pick-top > :first-child::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-inline-end: 8px; border-radius: 1px; background: var(--accent); vertical-align: 0.12em; }
@media (hover: hover) { .flow-pick[aria-pressed="false"]:hover { box-shadow: var(--ring-strong); } }
.flow-meta { display: grid; gap: 6px; max-width: 46em; }
.flow-trigger { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.flow-trigger > span:last-child { font-family: var(--mono); font-size: 14px; }
.flow-summary { color: var(--body); }
.flow-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--grid-gap); align-items: start; }
.flow-layout > * { min-width: 0; }
/* Stacked: the step card comes first, so Continue stays in place; the diagram follows as the overview. */
@media (max-width: 1179px) { .flow-layout > .step-card { order: -1; } }
.flow-layout.is-stacked > .step-card { order: -1; }
@media (min-width: 1180px) {
  .flow-layout:not(.is-stacked) { grid-template-columns: minmax(0, 1fr) 380px; }
  .flow-layout:not(.is-stacked) > .step-card { position: sticky; inset-block-start: var(--sticky-top); }
  .flow-layout:not(.is-stacked) > .step-card.is-static { position: static; }
}
.seq-wrap { overflow: clip; }
.seq svg { display: block; }
.seq-heads-wrap { position: sticky; inset-block-start: var(--heads-top); z-index: 1; overflow: hidden; background: var(--surface); box-shadow: inset 0 -1px 0 var(--line); }
.seq-heads { will-change: transform; }
.seq-body { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
.seq-head-box { fill: var(--surface); stroke: var(--line); stroke-width: var(--hair); rx: var(--radius); }
.seq-head-icon { color: var(--muted); }
.seq-head-label { font-family: var(--sans); font-size: 12.5px; font-weight: 500; fill: var(--ink); }
.seq-lifeline { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 5; }
.seq-step { cursor: pointer; }
.seq-step .arrow { fill: none; stroke: var(--faint); stroke-width: 1.25; }
.seq-step.is-done .arrow { stroke: var(--muted); }
.seq-step.is-current .arrow { stroke: var(--accent); stroke-width: 2; }
.seq-step.is-dashed .arrow { stroke-dasharray: 5 4; }
.seq-step .label { font-family: var(--sans); font-size: 12px; fill: var(--quiet); }
.seq-step.is-done .label { fill: var(--body); }
.seq-step.is-current .label { fill: var(--ink); font-weight: 550; }
.seq-step .badge-bg { fill: var(--surface); stroke: var(--faint); stroke-width: 1; }
.seq-step.is-done .badge-bg { stroke: var(--accent); }
.seq-step.is-current .badge-bg { fill: var(--accent-fill); stroke: var(--accent-fill); }
.seq-step .badge-num { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); }
.seq-step.is-done .badge-num { fill: var(--accent-text); }
.seq-step.is-current .badge-num { fill: var(--on-accent); }
.seq-step .hit { fill: transparent; }
@media (hover: hover) { .seq-step:hover .hit { fill: var(--hover-tint); } }
.seq-step:focus-visible { outline: none; }
.seq-step:focus-visible .hit { stroke: var(--ink); stroke-width: 1.5; }
.seq-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.seq-step .arrow, .seq-step .badge-bg, .seq-step .label { transition: stroke 200ms ease, fill 200ms ease; }
.step-card { display: flex; flex-direction: column; gap: 16px; padding: var(--card-pad); container: step-card / inline-size; }
/* A wide step card (stacked layout) puts the code beside the words. */
@container step-card (min-width: 760px) {
  .step-body:has(> .step-code) { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
}
/* Code in cards wraps: no sideways scroll inside a lesson card. */
.step-card pre.code, .concept-card pre.code { white-space: pre-wrap; overflow-wrap: anywhere; overflow-x: hidden; }
.step-body, .step-text { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.step-code { display: grid; gap: 8px; min-width: 0; }
.step-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.step-count { color: var(--muted); }
.step-card h3, .concept-card h3 { font-size: 22px; line-height: 1.2; letter-spacing: -0.03em; }
.step-card p { color: var(--body); }
.step-route { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 14px; color: var(--ink); }
.route-part { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.route-part svg { flex: none; width: 18px; height: 18px; color: var(--muted); }
.step-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.step-controls .btn.primary { margin-inline-start: auto; }
.step-dots { display: flex; flex-basis: 100%; gap: 3px; }
.step-dots button { position: relative; flex: 1 1 0; min-width: 4px; height: 20px; padding: 0; border: 0; background: none; }
.step-dots button::before { content: ""; position: absolute; inset-inline: 0; inset-block-start: 8px; height: 4px; border-radius: 9999px; background: var(--line); transition: background-color 200ms ease; }
.step-dots button.is-done::before, .step-dots button.is-current::before { background: var(--accent); }
.step-dots button:focus-visible { outline-offset: 0; }
.kbd-hint { font-size: 13px; color: var(--muted); }
.flow-done { display: grid; justify-items: center; gap: 8px; padding: 24px 8px; text-align: center; }
.flow-done .trophy { display: grid; place-items: center; width: 56px; height: 56px; margin-block-end: 8px; border-radius: var(--radius); box-shadow: inset 0 0 0 var(--hair) var(--accent); color: var(--accent-text); }
.flow-done .trophy svg { width: 28px; height: 28px; }
.flow-done h3 { font-size: 24px; }
.flow-done .btn-row { justify-content: center; margin-block-start: 12px; }

/* ---------- Changes ---------- */
.changes-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-block-start: 8px; }
.changes-map { margin-inline-start: auto; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--ring); }
.seg-option { min-height: 32px; padding: 0 12px; border: 0; border-radius: var(--radius-sm); background: none; font-size: 14px; color: var(--muted); }
.seg-option[aria-pressed="true"] { background: var(--canvas); color: var(--ink); font-weight: 500; box-shadow: var(--ring); }
@media (hover: hover) { .seg-option[aria-pressed="false"]:hover { color: var(--ink); } }
.timeline { position: relative; display: grid; gap: 12px; }
.timeline::before { content: ""; position: absolute; inset-inline-start: 17.5px; inset-block: 12px; width: 1px; background: var(--line); }
.change { position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 14px; }
.change-dot { position: relative; z-index: 1; display: grid; place-items: center; width: 36px; height: 36px; margin-block-start: 14px; border-radius: var(--radius); background: var(--surface); box-shadow: inset 0 0 0 var(--hair) var(--faint); color: var(--muted); }
.change.is-agent .change-dot { color: var(--ink); }
.change-dot svg { width: 18px; height: 18px; }
.change-card { display: grid; gap: 10px; padding: 18px 20px; }
.change.is-target .change-card { box-shadow: var(--ring-accent); }
.change.is-target .change-dot { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent-text); }
.change-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.change-card h3 { font-size: 18px; line-height: 1.3; letter-spacing: -0.015em; }
.change-card > p { color: var(--body); }
.change-nodes { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Tree ---------- */
.tree { padding: 6px 0; }
.tree li { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 16px; align-items: baseline; padding: 10px 16px; }
.tree li + li { box-shadow: inset 0 1px 0 var(--line); }
.tree li.is-target { box-shadow: var(--ring-accent); border-radius: var(--radius); }
.tree .path { display: flex; align-items: flex-start; gap: 8px; min-width: 0; font-family: var(--mono); font-size: 13px; color: var(--ink); }
.tree .path svg { flex: none; width: 16px; height: 16px; margin-block-start: 2px; color: var(--muted); }
.path-text { min-width: 0; overflow-wrap: anywhere; }
.tree .note { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; font-size: 15px; color: var(--body); }
.tree li.is-key .path { font-weight: 500; }

/* ---------- Data model ---------- */
.er-canvas { min-width: calc(var(--er-cols) * 130px); }
.er-grid { position: relative; display: grid; grid-template-columns: repeat(var(--er-cols), minmax(0, 1fr)); row-gap: 72px; column-gap: 0; padding: 8px 0; }
.entity {
  justify-self: center; display: flex; flex-direction: column; gap: 10px; width: min(100% - 32px, 250px); padding: 12px 14px; border: 0; text-align: start;
  border-radius: var(--radius); background: var(--surface); box-shadow: var(--ring); color: var(--ink); transition: opacity 160ms var(--ease), box-shadow 160ms var(--ease);
}
@media (hover: hover) { .entity:hover { box-shadow: var(--ring-strong); } }
.entity-head { display: flex; align-items: center; gap: 10px; }
.entity-head .node-icon { width: 28px; height: 28px; }
.entity-name { font-size: 15px; font-weight: 500; }
.entity-count { margin-inline-start: auto; font-family: var(--mono); font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.entity-keys { display: grid; gap: 4px; padding-block-start: 10px; box-shadow: inset 0 1px 0 var(--line); }
.entity-key { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--body); }
.key-badge { display: inline-grid; place-items: center; min-width: 26px; padding: 0 4px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 var(--hair) var(--line); font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em; color: var(--muted); }
.key-badge.is-pk { box-shadow: inset 0 0 0 var(--hair) var(--faint); color: var(--ink); }
.er-canvas.has-selection .entity { opacity: 0.45; }
.er-canvas.has-selection .entity.is-related { opacity: 1; }
.er-canvas.has-selection .entity.is-selected { opacity: 1; box-shadow: var(--ring-accent); }
.er-card { font-family: var(--mono); font-size: 11.5px; fill: var(--muted); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; }
.er-canvas.has-selection .er-card.is-active { fill: var(--accent-text); }
.er-canvas.has-selection .edge.is-active { opacity: 1; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: none; animation: none; }
.er-canvas.has-selection .edge-label.is-active { opacity: 1; }
.er-detail { overflow: hidden; }
.er-detail-head { display: grid; gap: 6px; padding: 20px var(--card-pad) 16px; }
.er-detail-head h3 { display: flex; align-items: center; gap: 10px; font-size: 22px; letter-spacing: -0.03em; }
.er-detail-head p { color: var(--body); }
.er-row { display: grid; grid-template-columns: minmax(180px, 1.1fr) minmax(140px, 1fr) minmax(0, 1.6fr); gap: 16px; align-items: baseline; padding: 11px var(--card-pad); box-shadow: inset 0 1px 0 var(--line); }
.er-row-head { padding-block: 8px; background: var(--canvas); font-family: var(--mono); font-size: 12px; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--muted); }
.er-name { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.er-name code { font-size: 13.5px; font-weight: 500; color: var(--ink); }
.er-type code { font-size: 13px; color: var(--body); overflow-wrap: anywhere; }
.er-note { font-size: 15px; color: var(--body); }
.er-fk { font-family: var(--mono); font-size: 12.5px; }
.er-rels { display: grid; gap: 10px; padding: 16px var(--card-pad) 20px; box-shadow: inset 0 1px 0 var(--line); }

/* ---- lessons.css ---- */
/* Lessons: concepts, quiz, glossary, runbook; narrow-screen and print rules for every view. */

/* ---------- Concepts and quiz ---------- */
.lesson { max-width: 760px; }
.concept-card { display: flex; flex-direction: column; gap: 14px; min-height: 280px; padding: var(--card-pad); }
.concept-body { font-size: 17px; color: var(--body); }
.concept-card .step-controls { margin-block-start: auto; padding-block-start: 8px; }
.quiz { display: grid; gap: var(--grid-gap); }
.options { display: grid; gap: 8px; }
.option {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 10px 14px; border: 0; border-radius: var(--radius);
  background: var(--surface); box-shadow: var(--ring); text-align: start; font-size: 15px; color: var(--ink); transition: box-shadow 150ms var(--ease);
}
.option .key { flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 var(--hair) var(--faint); font-family: var(--mono); font-size: 12px; color: var(--muted); }
.option-text { min-width: 0; }
@media (hover: hover) { .option:not(:disabled):hover { box-shadow: var(--ring-strong); } }
.option[aria-checked="true"] { background: var(--select-wash); box-shadow: var(--ring-ink); }
.option[aria-checked="true"] .key { box-shadow: inset 0 0 0 var(--hair) var(--ink); color: var(--ink); }
.option:disabled { cursor: default; }

/* ---------- Quiz: one question at a time ----------
   Status is ink text with a small coloured marker: never a saturated chip, a coloured headline or a strike-through. */
.quiz-card { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: var(--card-pad); }
.quiz-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.quiz-reset, .quiz-reveal { font-size: 14px; color: var(--muted); }
.quiz-q, .quiz-score { font-size: 22px; line-height: 1.25; letter-spacing: -0.03em; }
.quiz-q:focus, .quiz-score:focus, .feedback-head:focus { outline: none; }
.option-text.is-code { display: block; font-family: var(--mono); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.option .tag-answer { margin-inline-start: auto; flex: none; }
.option .tag-answer::before { content: "\2713"; display: inline-block; margin-inline-end: 6px; color: var(--good); font-weight: 600; }
.option-note { margin-inline-start: auto; flex: none; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.option.is-tried .key { box-shadow: none; background: none; position: relative; }
.option.is-tried .key::after { content: ""; position: absolute; inset-block-start: -2px; inset-inline-end: -2px; width: 7px; height: 7px; border-radius: 9999px; background: var(--bad); box-shadow: 0 0 0 2px var(--surface); }
.option.is-tried { box-shadow: var(--ring-strong); }
.option.is-answer { box-shadow: 0 0 0 var(--hair) var(--good); background: var(--surface); }
.option.is-answer .key { position: relative; }
.option.is-answer .key::after { content: ""; position: absolute; inset-block-start: -2px; inset-inline-end: -2px; width: 7px; height: 7px; border-radius: 9999px; background: var(--good); box-shadow: 0 0 0 2px var(--surface); }
.option:disabled { color: var(--ink); opacity: 1; }
.option:disabled:not(.is-answer) { color: var(--body); }
.quiz-live:empty { display: none; }
.feedback { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; padding: 14px 16px; border-radius: var(--radius); background: var(--canvas); box-shadow: inset 0 0 0 var(--hair) var(--line); color: var(--body); }
.feedback-head { display: flex; align-items: center; gap: 8px; font-weight: 550; color: var(--ink); }
.status-dot { flex: none; width: 8px; height: 8px; border-radius: 9999px; background: var(--muted); }
.feedback.is-right .status-dot { background: var(--good); }
.feedback.is-retry .status-dot { background: var(--bad); }
.feedback.is-missed .status-dot { background: var(--accent); }
.quiz-controls .quiz-reveal { margin-inline-start: 4px; }
.quiz-dots button.is-done:not(.is-current)::before { background: var(--faint); }
.quiz-dots button.is-current::before { background: var(--accent); }
.quiz-missed { display: grid; gap: 6px; }
.quiz-missed-row { display: grid; gap: 2px; padding: 10px 0; }
.quiz-missed-row + .quiz-missed-row { box-shadow: inset 0 1px 0 var(--line); }
.quiz-lesson { font-size: 14px; color: var(--muted); }
.quiz-perfect { color: var(--body); }

/* ---------- Glossary and runbook ---------- */
.glossary-wrap { display: grid; gap: var(--grid-gap); }
.search {
  width: 100%; max-width: 480px; min-height: 44px; padding: 0 14px; border: 0; border-radius: var(--radius);
  background: var(--surface); box-shadow: var(--ring); font: inherit; font-size: 16px; color: var(--ink);
}
.search::placeholder { color: var(--quiet); }
.search:focus-visible { outline: none; box-shadow: var(--ring-ink); }
.glossary { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.glossary div { display: grid; gap: 4px; align-content: start; padding: 16px 18px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--ring); }
.glossary div.is-target { box-shadow: var(--ring-accent); }
.glossary dt { font-weight: 500; }
.glossary dd { font-size: 15px; color: var(--body); }
.runbook { display: grid; gap: 12px; max-width: 860px; }
.run-item { display: grid; gap: 10px; padding: 16px 20px 20px; }
.run-head { display: flex; align-items: center; gap: 12px; }
.run-head h3 { flex: 1 1 auto; min-width: 0; font-size: 17px; font-weight: 500; letter-spacing: -0.01em; }
.run-n { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.run-note { font-size: 15px; color: var(--body); }


/* ---------- Narrow screens ---------- */
@media (max-width: 900px) {
  .map-detail { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) {
  :root { --card-pad: 16px; --title-gap: 24px; }
  .map-panel { padding: 16px; }
  .map-canvas { min-width: 0; }
  .map-grid { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .tree li { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .er-canvas { min-width: 0; }
  .er-grid { grid-template-columns: minmax(0, 1fr); row-gap: 28px; }
  .entity { grid-column: 1 / -1 !important; grid-row: auto !important; width: 100%; }
  .er-row { grid-template-columns: minmax(0, 1fr) auto; }
  .er-note { grid-column: 1 / -1; }
  .er-row-head .er-note, .er-row-head span:last-child { display: none; }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager-link.is-next { text-align: start; }
  .changes-map { margin-inline-start: 0; }
}
@media print {
  .side, .top, .sheet, .pager, .step-controls, .theme-switch { display: none !important; }
  .app { display: block; }
}

/* ---- chapters.css ---- */
/* Chapters for v2 types (context, diff, options, risks, rollout, timeline)
   and the parts they share with the existing chapters: node status markers,
   before/after flow pairs, concept parts. The visuals kit is in visuals.css.
   Status is ink text plus a small marker; var(--select) marks where you are
   (orange in Clean, blue in Playful); var(--accent) marks what is done. */

/* ---------- Shared ---------- */
.ch-cq { container-type: inline-size; min-width: 0; }
.ch-split { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--grid-gap); align-items: start; }
@container (min-width: 820px) { .ch-split { grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); } }
.ch-detail { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-content: start; padding: var(--card-pad); }
.ch-detail h3 { font-size: 20px; line-height: 1.25; letter-spacing: -0.025em; }
.ch-detail p { color: var(--body); }
.ch-detail-empty { display: grid; gap: 6px; }
.ch-detail-empty h3 { font-size: 18px; }
.ch-stepper { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-block-start: 6px; }
.ch-stepper-count { margin-inline: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ch-command { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: start; }
.ch-command pre.code { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; overflow-x: hidden; }
.ch-ctx-none { font-size: 14px; color: var(--muted); }
.ch-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-family: var(--mono); font-size: 12px; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--muted); }
.ch-legend > li, .ch-legend > span { display: inline-flex; align-items: center; gap: 6px; }

/* Status: a glyph in a hairline square, beside ink text. */
.ch-mark {
  display: inline-grid; flex: none; place-items: center; width: 16px; height: 16px; border-radius: var(--radius-sm);
  box-shadow: inset 0 0 0 var(--hair) var(--faint); font: 500 12px/1 var(--mono); letter-spacing: 0; color: var(--ink);
}
.ch-mark.is-added { box-shadow: inset 0 0 0 var(--hair) var(--ink); }
.ch-mark.is-removed, .ch-mark.is-unchanged { color: var(--muted); }
.ch-status { display: inline-flex; align-items: center; gap: 6px; min-width: 0; font-size: 14px; color: var(--ink); }
.ch-state { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); }
.ch-state-mark { flex: none; width: 8px; height: 8px; border-radius: 9999px; box-shadow: inset 0 0 0 1.5px var(--muted); }
.ch-state.is-settled .ch-state-mark { background: var(--ink); box-shadow: none; }
.ch-state.is-next .ch-state-mark { box-shadow: inset 0 0 0 2px var(--accent); }

.ch-marked { display: grid; gap: 6px; }
.ch-marked li { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; align-items: baseline; color: var(--body); }
.ch-dot { width: 8px; height: 8px; border-radius: 2px; }
.ch-dot.is-pro { background: var(--ink); }
.ch-dot.is-con { box-shadow: inset 0 0 0 1.5px var(--muted); }

/* ---------- Context: problem -> goals, with what is out of scope ---------- */
.ch-context { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; }
@container (min-width: 760px) { .ch-context { grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1.1fr); } }
.ch-ctx-box { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; padding: var(--card-pad); }
.ch-ctx-problem { box-shadow: var(--ring-strong); }
.ch-ctx-problem-text { font-size: 18px; line-height: 1.5; color: var(--ink); }
.ch-ctx-scope { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; }
.ch-ctx-out { border: 1px dashed var(--faint); border-radius: var(--radius); }
.ch-ctx-icon { display: inline-block; width: 8px; height: 8px; margin-inline-end: 8px; border-radius: 2px; vertical-align: 0.06em; }
.ch-ctx-icon.is-problem { background: var(--ink); }
.ch-ctx-icon.is-goal { box-shadow: inset 0 0 0 1.5px var(--ink); }
.ch-ctx-icon.is-out { border: 1px dashed var(--muted); }
.ch-ctx-list li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: baseline; padding-block: 8px; color: var(--ink); }
.ch-ctx-list li + li { box-shadow: inset 0 1px 0 var(--line); }
.ch-ctx-list.is-out li { color: var(--body); }
.ch-ctx-n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 var(--hair) var(--faint); font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.ch-ctx-list.is-goals .ch-ctx-n { box-shadow: inset 0 0 0 var(--hair) var(--ink); color: var(--ink); }
.ch-ctx-list.is-out .ch-ctx-n { box-shadow: none; border: 1px dashed var(--faint); }
/* The connector: a line with a head, down on phones and across when wide. */
.ch-ctx-arrow { position: relative; display: grid; place-items: center; min-height: 48px; }
.ch-ctx-arrow::before { content: ""; position: absolute; inset-block: 6px 10px; inset-inline-start: 50%; width: 1px; background: var(--faint); }
.ch-ctx-arrow::after { content: ""; position: absolute; inset-block-end: 4px; inset-inline-start: calc(50% - 4.5px); border: 5px solid transparent; border-block-start-color: var(--faint); border-block-end-width: 0; }
.ch-ctx-arrow span { position: relative; padding: 2px 6px; background: var(--canvas); font-family: var(--mono); font-size: 11px; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--muted); }
@container (min-width: 760px) {
  .ch-ctx-arrow { align-self: start; min-height: 0; height: 100%; max-height: 180px; }
  .ch-ctx-arrow::before { inset-block: 50% auto; inset-inline: 6px 10px; width: auto; height: 1px; }
  .ch-ctx-arrow::after { inset-block-end: auto; inset-block-start: calc(50% - 4.5px); inset-inline: auto 4px; border: 5px solid transparent; border-inline-start-color: var(--faint); border-inline-end-width: 0; }
  .ch-ctx-arrow span { display: none; }
}
.ch-ctx-status { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }

/* ---------- Diff: one bar per file ---------- */
.ch-diff { display: grid; grid-template-columns: minmax(0, 1fr); }
.ch-diff-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 12px 16px; box-shadow: inset 0 -1px 0 var(--line); }
.ch-diff-total { display: flex; align-items: baseline; gap: 10px; }
.ch-legend-bars { margin-inline-start: auto; }
.ch-swatch { display: inline-block; width: 14px; height: 6px; border-radius: 1px; }
.ch-swatch.is-add { background: var(--muted); }
.ch-swatch.is-del { box-shadow: inset 0 0 0 1px var(--muted); }
.ch-file-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 6px; }
.ch-file {
  display: grid; grid-template-columns: 16px minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; min-height: 44px;
  padding: 8px 10px; border: 0; border-radius: var(--radius); background: none; color: var(--ink); text-align: start; transition: box-shadow 150ms var(--ease);
}
@media (hover: hover) { .ch-file:not(.is-selected):hover { background: var(--hover-tint); } }
.ch-file.is-selected { background: var(--select-wash); box-shadow: var(--ring-accent); }
.ch-file-name { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ch-file-path { display: block; min-width: 0; font-family: var(--mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-file-name .tag { flex: none; }
.ch-file.is-removed .ch-file-path { color: var(--muted); }
.ch-bar { display: grid; grid-template-columns: minmax(0, 1fr) 76px; gap: 10px; align-items: center; min-width: 0; }
.ch-bar-track { display: flex; gap: 2px; height: 8px; min-width: 0; }
.ch-bar-track i { display: block; flex: none; width: calc(var(--share, 0) * 100%); border-radius: 1px; }
.ch-bar-add { background: var(--muted); }
.ch-bar-del { box-shadow: inset 0 0 0 1px var(--muted); }
.ch-file.is-selected .ch-bar-add { background: var(--select); }
.ch-file.is-selected .ch-bar-del { box-shadow: inset 0 0 0 1px var(--select); }
.ch-bar-num { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: end; }
.ch-bar.is-empty { grid-template-columns: minmax(0, 1fr); }
.ch-bar-none { font-family: var(--mono); font-size: 11.5px; color: var(--quiet); }
@container (max-width: 560px) {
  .ch-file { grid-template-columns: 16px minmax(0, 1fr); row-gap: 6px; }
  .ch-file > .ch-bar { grid-column: 2; }
  .ch-legend-bars { margin-inline-start: 0; }
}
.ch-detail-path { font-family: var(--mono); font-size: 15px; font-weight: 500; letter-spacing: 0; overflow-wrap: anywhere; }
.ch-from { font-size: 14px; }
.ch-from code { font-size: 13px; overflow-wrap: anywhere; }
.ch-node-links { display: flex; flex-wrap: wrap; gap: 6px; }
.ch-node-link {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 32px; padding: 2px 10px; border-radius: var(--radius);
  background: var(--surface); box-shadow: var(--ring); font-size: 14px; color: var(--ink); text-decoration: none; overflow-wrap: anywhere;
}
@media (hover: hover) { .ch-node-link:hover { box-shadow: var(--ring-strong); } }

/* ---------- Options: score strip and matrix ---------- */
.ch-options { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--grid-gap); }
.ch-strip { display: grid; grid-template-columns: minmax(0, 1fr); }
.ch-strip-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 12px 16px; box-shadow: inset 0 -1px 0 var(--line); }
.ch-decision { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-weight: 500; color: var(--ink); }
.ch-strip-rows { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 6px; }
.ch-score {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 84px; gap: 12px; align-items: center; width: 100%; min-height: 44px;
  padding: 8px 10px; border: 0; border-radius: var(--radius); background: none; color: var(--ink); text-align: start;
}
@media (hover: hover) { .ch-score:not(.is-selected):hover { background: var(--hover-tint); } }
.ch-score.is-selected { background: var(--select-wash); box-shadow: var(--ring-accent); }
.ch-score-title { min-width: 0; font-size: 15px; font-weight: 500; overflow-wrap: anywhere; }
/* Diverging marks: pros grow left of the axis, cons right of it. */
.ch-score-marks { display: grid; grid-template-columns: minmax(0, 1fr) 1px minmax(0, 1fr); gap: 8px; align-items: center; }
.ch-score-marks > .is-pro { justify-self: end; }
.ch-score-axis { width: 1px; height: 18px; background: var(--faint); }
.ch-score > .ch-chosen { grid-column: 3; justify-self: end; }
.ch-marks { display: inline-flex; gap: 3px; }
.ch-marks i { display: block; width: 10px; height: 10px; border-radius: 2px; }
.ch-marks.is-pro i { background: var(--ink); }
.ch-marks.is-con i { box-shadow: inset 0 0 0 1.5px var(--muted); }
.ch-chosen { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11.5px; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--ink); white-space: nowrap; }
.ch-chosen::before { content: "\2713"; font-weight: 600; color: var(--accent-text); }
.ch-matrix { display: grid; grid-template-columns: repeat(var(--opts, 2), minmax(0, 1fr)); grid-template-rows: repeat(5, auto); gap: 0 var(--grid-gap); }
.ch-opt-col { display: grid; grid-row: span 5; grid-template-rows: subgrid; min-width: 0; border-radius: var(--radius); background: var(--surface); box-shadow: var(--ring); }
.ch-opt-col.is-chosen { box-shadow: var(--ring-strong); }
.ch-opt-col.is-selected { box-shadow: var(--ring-accent); }
.ch-opt-head { display: grid; gap: 4px; align-content: start; padding: 16px 18px 12px; }
.ch-opt-head h3 { font-size: 18px; line-height: 1.25; letter-spacing: -0.02em; }
.ch-opt-cell { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; align-content: start; padding: 12px 18px; box-shadow: inset 0 1px 0 var(--line); }
.ch-opt-cell > p:not(.detail-label) { color: var(--body); }
.ch-opt-cell:empty { display: none; }
.ch-opt-cell .detail-label { margin: 0; }
@container (max-width: 719px) {
  .ch-matrix { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
  .ch-opt-col { grid-row: auto; grid-template-rows: none; }
  .ch-opt-col:not(.is-selected) { display: none; }
  .ch-score { grid-template-columns: minmax(0, 1fr) auto; }
  .ch-score-marks { grid-row: 2; }
  .ch-score > .ch-chosen { grid-column: 2; grid-row: 1; }
}

/* ---------- Risks: rows by impact ---------- */
.ch-impact-grid { display: grid; grid-template-columns: minmax(0, 1fr); }
.ch-impact-row { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px 16px; }
.ch-impact-row + .ch-impact-row { box-shadow: inset 0 1px 0 var(--line); }
.ch-impact-head { display: flex; align-items: center; gap: 8px; min-height: 44px; font-family: var(--mono); font-size: 12px; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--ink); }
.ch-impact-count { color: var(--muted); }
.ch-impact-cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 8px; align-items: start; }
.ch-impact-cells > .ch-ctx-none { align-self: center; min-height: 44px; display: flex; align-items: center; }
.ch-meter { display: inline-flex; flex: none; align-items: flex-end; gap: 2px; height: 12px; }
.ch-meter i { display: block; width: 3px; border-radius: 1px; background: var(--line); }
.ch-meter i:nth-child(1) { height: 5px; }
.ch-meter i:nth-child(2) { height: 8px; }
.ch-meter i:nth-child(3) { height: 12px; }
.ch-meter i.is-on { background: var(--ink); }
.ch-impact { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--ink); }
.ch-risk {
  display: grid; gap: 4px; width: 100%; min-height: 44px; padding: 10px 12px; border: 0; border-radius: var(--radius);
  background: var(--surface); box-shadow: var(--ring); color: var(--ink); text-align: start; font-size: 14.5px; line-height: 1.4;
  transition: box-shadow 150ms var(--ease);
}
@media (hover: hover) { .ch-risk:not(.is-selected):hover { box-shadow: var(--ring-strong); } }
.ch-risk.is-selected { background: var(--select-wash); box-shadow: var(--ring-accent); }
.ch-risk-text { min-width: 0; overflow-wrap: anywhere; }
.ch-risk-owner { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.ch-owner { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.ch-owner .detail-label { margin: 0; }
@container (max-width: 520px) {
  .ch-impact-row { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .ch-impact-head { min-height: 0; }
}

/* ---------- Rollout: a stepped track ---------- */
/* Rollout and timeline: the track gets the full width, the detail sits below it. */
.ch-stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--grid-gap); }
.ch-track-panel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; padding: var(--card-pad); }
.ch-progress { display: grid; gap: 8px; max-width: 360px; color: var(--body); }
.ch-track { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); }
.ch-track > li { position: relative; padding-block-end: 14px; }
.ch-track > li:last-child { padding-block-end: 0; }
.ch-track > li:not(:last-child)::before { content: ""; position: absolute; inset-block: 36px -2px; inset-inline-start: 21px; width: 2px; border-radius: 1px; background: var(--line); }
.ch-track > li.is-done:not(:last-child)::before { background: var(--accent); }
.ch-step {
  display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: start; width: 100%; padding: 6px; border: 0;
  border-radius: var(--radius); background: none; color: var(--ink); text-align: start; transition: box-shadow 150ms var(--ease);
}
@media (hover: hover) { .ch-step:not(.is-selected):hover { background: var(--hover-tint); } }
.ch-step.is-selected { background: var(--select-wash); box-shadow: var(--ring-accent); }
.ch-step-node {
  position: relative; z-index: 1; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9999px;
  background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--faint); font: 500 12px/1 var(--mono); color: var(--muted);
}
.ch-step.is-done .ch-step-node { background: var(--accent-fill); box-shadow: none; color: var(--on-accent); font-size: 14px; }
.ch-step.is-next .ch-step-node { box-shadow: inset 0 0 0 2px var(--accent); color: var(--accent-text); }
.ch-step-text { display: grid; gap: 2px; min-width: 0; padding-block-start: 2px; }
.ch-step-state { font-family: var(--mono); font-size: 11px; letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--muted); }
.ch-step.is-next .ch-step-state { color: var(--ink); }
.ch-step-label { font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
.ch-track.is-across { grid-template-columns: repeat(var(--steps, 1), minmax(0, 1fr)); }
.ch-track.is-across > li { padding-block-end: 0; padding-inline-end: 8px; }
.ch-track.is-across > li:not(:last-child)::before { inset-block: 21px auto; inset-inline: 44px 0; width: auto; height: 2px; }
.ch-track.is-across .ch-step { grid-template-columns: minmax(0, 1fr); gap: 10px; }

/* ---------- Timeline: a time axis, typed markers ---------- */
.ch-timeline { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding: var(--card-pad); }
.ch-event-mark { flex: none; fill: none; stroke: var(--ink); stroke-width: 1.5; }
.ch-event-mark.is-none { fill: var(--muted); stroke: none; }
.ch-axis { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; }
.ch-axis::before { content: ""; position: absolute; inset-block: 14px; inset-inline-start: 20px; width: 1px; background: var(--line); }
.ch-event {
  position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; padding: 6px;
  border: 0; border-radius: var(--radius); background: none; color: var(--ink); text-align: start; transition: box-shadow 150ms var(--ease);
}
@media (hover: hover) { .ch-event:not(.is-selected):hover { background: var(--hover-tint); } }
.ch-event.is-selected { background: var(--select-wash); box-shadow: var(--ring-accent); }
.ch-event.is-selected .ch-event-mark { stroke: var(--select); }
.ch-event.is-selected .ch-event-mark.is-none { fill: var(--select); }
.ch-event-dot { position: relative; z-index: 1; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9999px; background: var(--surface); box-shadow: inset 0 0 0 var(--hair) var(--line); }
.ch-event-text { display: grid; gap: 2px; min-width: 0; }
.ch-event-at { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.ch-event-label { display: block; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
.ch-axis.is-across { grid-template-columns: repeat(var(--events, 1), minmax(0, 1fr)); gap: 0; }
.ch-axis.is-across::before { inset-block: 110px auto; inset-inline: 0; width: auto; height: 1px; }
.ch-axis.is-across .ch-event { grid-template-columns: minmax(0, 1fr); grid-template-rows: 92px 28px 92px; gap: 4px; justify-items: center; height: 100%; padding: 4px; text-align: center; }
.ch-axis.is-across .ch-event-dot { grid-row: 2; }
.ch-axis.is-across .is-high .ch-event-text { grid-row: 1; align-self: end; }
.ch-axis.is-across .is-low .ch-event-text { grid-row: 3; align-self: start; }
.ch-axis.is-across .ch-event-label { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; font-size: 13.5px; }

/* ---------- Map: node status (helpers in chapters/hooks.js) ---------- */
.ch-node-status { position: absolute; inset-block-start: -8px; inset-inline-start: 10px; display: inline-flex; border-radius: var(--radius-sm); background: var(--surface); }
.node[data-status="removed"] .node-label { color: var(--muted); }
.node[data-status="removed"] .node-icon { box-shadow: inset 0 0 0 var(--hair) var(--line); color: var(--faint); }
.ch-legend-status { display: inline-flex; align-items: center; gap: 8px; }

/* ---------- Flows: before and after side by side ---------- */
.ch-pair-switch { justify-self: start; }
.ch-pair { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@container (min-width: 720px) { .ch-pair { grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr); } }
.ch-pair-side { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; align-content: start; padding: 16px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--ring); }
.ch-pair-side.is-before { box-shadow: inset 0 0 0 1px var(--line); background: var(--canvas); }
.ch-pair-side .eyebrow { display: flex; justify-content: space-between; gap: 12px; }
.ch-pair-count { color: var(--muted); }
.ch-pair-title { font-weight: 500; color: var(--ink); }
.ch-pair-only { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.ch-pair-steps { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.ch-pair-step { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; padding: 6px; border: 0; border-radius: var(--radius-sm); background: none; color: var(--ink); text-align: start; }
.ch-pair-step:disabled { cursor: default; color: var(--ink); }
@media (hover: hover) { .ch-pair-step:not(:disabled):hover { background: var(--hover-tint); } }
.ch-pair-n { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 9999px; box-shadow: inset 0 0 0 1px var(--faint); font-family: var(--mono); font-size: 11px; color: var(--muted); }
.ch-pair-hop { display: grid; gap: 1px; min-width: 0; }
.ch-pair-route { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.ch-pair-label { font-size: 14.5px; overflow-wrap: anywhere; }
.ch-pair-arrow { position: relative; min-height: 20px; }
.ch-pair-arrow::after { content: "\2193"; position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); color: var(--faint); }
@container (min-width: 720px) { .ch-pair-arrow::after { content: "\2192"; } }
.ch-variant::before { content: ""; display: inline-block; width: 6px; height: 6px; margin-inline-end: 6px; vertical-align: 1px; border-radius: 1px; box-shadow: inset 0 0 0 1px var(--muted); }
.ch-variant.is-after::before { background: var(--muted); }

/* ---------- Concepts: parts and a visual (helpers in chapters/hooks.js) ---------- */
.ch-concept-extras { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.ch-parts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.ch-part-chain { display: flex; flex-wrap: wrap; gap: 8px 24px; }
.ch-part-chain > li { position: relative; min-width: 0; max-width: 100%; }
.ch-part-chain > li + li::before { content: "\2192"; position: absolute; inset-inline-start: -18px; inset-block-start: 50%; translate: 0 -50%; font-family: var(--mono); font-size: 13px; color: var(--faint); }
.ch-part {
  display: inline-flex; align-items: center; gap: 8px; max-width: 100%; min-height: 40px; padding: 6px 12px 6px 6px; border: 0; border-radius: var(--radius);
  background: var(--surface); box-shadow: var(--ring); color: var(--ink); font-size: 14.5px; line-height: 1.3; text-align: start; transition: box-shadow 150ms var(--ease);
}
@media (hover: hover) { .ch-part:not(.is-selected):hover { box-shadow: var(--ring-strong); } }
.ch-part.is-selected { background: var(--select-wash); box-shadow: var(--ring-accent); }
.ch-part-n { display: inline-grid; flex: none; place-items: center; width: 24px; height: 24px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 var(--hair) var(--faint); font-family: var(--mono); font-size: 12px; color: var(--muted); }
.ch-part.is-selected .ch-part-n { box-shadow: inset 0 0 0 var(--hair) var(--select); color: var(--ink); }
.ch-part-label { min-width: 0; overflow-wrap: anywhere; }
.ch-parts-detail { display: grid; gap: 4px; min-height: 64px; padding: 12px 14px; border-radius: var(--radius); background: var(--canvas); box-shadow: inset 0 0 0 var(--hair) var(--line); color: var(--body); }
.ch-parts-label { font-weight: 550; color: var(--ink); }
.ch-parts-tip { color: var(--muted); }

/* ---------- Pickers (visuals chapter) ---------- */
.ch-visuals { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--grid-gap); }
.ch-pick-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 8px; }
.ch-pick {
